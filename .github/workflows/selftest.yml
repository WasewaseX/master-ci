# =============================================================================
# Master CI Selftest - integration tests for the reusable workflow itself
# =============================================================================
# Default mode (push / PR / plain dispatch): calls the reusable workflow once
# with the quick profile and asserts the pipeline passes and reports
# verdict=passed. Green by design.
#
# Failure-path mode (dispatch with failure_paths=true): additionally calls the
# reusable workflow with a Semgrep pack that cannot exist, with an unsafe
# template_ref, with an invalid stack toggle, and with an unknown select job.
# Those four calls are EXPECTED to fail - the run turns red on purpose, and
# `verify` asserts that every pipeline reports verdict=failed, proving the
# aggregate gate fails when a check fails and that untrusted input is
# rejected before any checkout.
#
# The `select-subset` call runs in BOTH modes with `select: secrets` and must
# pass: it proves job selection works end-to-end (most jobs skip cleanly, the
# aggregate gate still reports verdict=passed).
# =============================================================================

name: Master CI Selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      failure_paths:
        description: "'true' also runs the expected-failure calls (run turns red by design)"
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

jobs:
  happy-path:
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      profile: quick
      scorecard_publish: false
      concurrency_key: selftest-happy
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  enforced-failure:
    if: inputs.failure_paths == 'true'
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      profile: standard
      semgrep_config: 'p/definitely-not-a-real-pack'
      scorecard_publish: false
      concurrency_key: selftest-fail
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  input-validation:
    if: inputs.failure_paths == 'true'
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      template_ref: '../not-a-ref'
      scorecard_publish: false
      concurrency_key: selftest-valid
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write

  # a typo in a stack toggle must fail meta - never silently skip the stack
  input-validation-stack-toggle:
    if: inputs.failure_paths == 'true'
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      run_python: 'ture'
      scorecard_publish: false
      concurrency_key: selftest-toggle
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write

  # an unknown select job must fail meta - never silently skip a check
  input-validation-select:
    if: inputs.failure_paths == 'true'
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      select: 'secrets,bogus-job'
      scorecard_publish: false
      concurrency_key: selftest-select-bad
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write

  # a valid select token runs only that job and the pipeline still passes
  select-subset:
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      select: 'secrets'
      scorecard_publish: false
      concurrency_key: selftest-select-good
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write

  verify:
    needs: [happy-path, enforced-failure, input-validation, input-validation-stack-toggle, input-validation-select, select-subset]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FAILURE_PATHS: ${{ inputs.failure_paths }}
      HAPPY_RESULT: ${{ needs.happy-path.result }}
      HAPPY_VERDICT: ${{ needs.happy-path.outputs.verdict }}
      FAIL_RESULT: ${{ needs.enforced-failure.result }}
      FAIL_VERDICT: ${{ needs.enforced-failure.outputs.verdict }}
      VALID_RESULT: ${{ needs.input-validation.result }}
      VALID_VERDICT: ${{ needs.input-validation.outputs.verdict }}
      TOGGLE_RESULT: ${{ needs.input-validation-stack-toggle.result }}
      TOGGLE_VERDICT: ${{ needs.input-validation-stack-toggle.outputs.verdict }}
      BADSELECT_RESULT: ${{ needs.input-validation-select.result }}
      BADSELECT_VERDICT: ${{ needs.input-validation-select.outputs.verdict }}
      SUBSET_RESULT: ${{ needs.select-subset.result }}
      SUBSET_VERDICT: ${{ needs.select-subset.outputs.verdict }}
    steps:
      - name: Assert selftest outcomes
        run: |
          fail=0
          assert_eq() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: '$2' (expected '$3')"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          assert_eq "happy-path job result" "$HAPPY_RESULT" "success"
          assert_eq "happy-path verdict" "$HAPPY_VERDICT" "passed"
          assert_eq "select-subset job result" "$SUBSET_RESULT" "success"
          assert_eq "select-subset verdict" "$SUBSET_VERDICT" "passed"
          if [ "$FAILURE_PATHS" = "true" ]; then
            assert_eq "enforced-failure job result" "$FAIL_RESULT" "failure"
            assert_eq "enforced-failure verdict" "$FAIL_VERDICT" "failed"
            assert_eq "input-validation job result" "$VALID_RESULT" "failure"
            assert_eq "input-validation verdict" "$VALID_VERDICT" "failed"
            assert_eq "stack-toggle validation result" "$TOGGLE_RESULT" "failure"
            assert_eq "stack-toggle validation verdict" "$TOGGLE_VERDICT" "failed"
            assert_eq "select validation result" "$BADSELECT_RESULT" "failure"
            assert_eq "select validation verdict" "$BADSELECT_VERDICT" "failed"
          else
            assert_eq "enforced-failure skipped" "$FAIL_RESULT" "skipped"
            assert_eq "input-validation skipped" "$VALID_RESULT" "skipped"
            assert_eq "stack-toggle validation skipped" "$TOGGLE_RESULT" "skipped"
            assert_eq "select validation skipped" "$BADSELECT_RESULT" "skipped"
          fi
          echo "selftest summary: happy=$HAPPY_VERDICT fail=$FAIL_VERDICT valid=$VALID_VERDICT subset=$SUBSET_VERDICT"
          exit $fail
