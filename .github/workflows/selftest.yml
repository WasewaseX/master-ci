# =============================================================================
# Master CI Selftest - integration tests for the reusable workflow itself
# =============================================================================
# This workflow is PERMANENTLY GREEN: red in CI may only ever mean broken,
# and a manual dispatch must behave exactly like a push. It calls the
# reusable workflow with the quick profile (must pass) and with
# `select: secrets` (job selection must pass end-to-end), then `verify`
# asserts both reported verdict=passed.
#
# The five intentionally failing calls (unreachable semgrep pack, traversal
# template_ref, typo'd stack toggle, unknown select job, foreign helper with
# an empty template_ref) do NOT live here: a job that calls a reusable
# workflow has no continue-on-error, so a failing call would redden this
# run no matter what. They live in selftest-guardrails.yml - a dedicated
# dispatch-only workflow whose red runs are correct by construction - and
# are exercised ROUTINELY by selftest-negative.yml, the watchdog, which
# dispatches the guardrails suite and asserts the red is exactly the
# designed red. See the headers of those two workflows for the details.
#
# The `select-subset` call runs `select: secrets` and must pass: it proves
# job selection works end-to-end (most jobs skip cleanly, the aggregate
# gate still reports verdict=passed).
# =============================================================================

name: Master CI Selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  happy-path:
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      profile: quick
      scorecard_publish: false
      concurrency_key: selftest-happy
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  # a valid select token runs only that job and the pipeline still passes
  select-subset:
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      select: 'secrets'
      scorecard_publish: false
      concurrency_key: selftest-select-good
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write

  verify:
    needs: [happy-path, select-subset]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAPPY_RESULT: ${{ needs.happy-path.result }}
      HAPPY_VERDICT: ${{ needs.happy-path.outputs.verdict }}
      SUBSET_RESULT: ${{ needs.select-subset.result }}
      SUBSET_VERDICT: ${{ needs.select-subset.outputs.verdict }}
    steps:
      - name: Assert selftest outcomes
        run: |
          fail=0
          assert_eq() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: '$2' (expected '$3')"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          assert_eq "happy-path job result" "$HAPPY_RESULT" "success"
          assert_eq "happy-path verdict" "$HAPPY_VERDICT" "passed"
          assert_eq "select-subset job result" "$SUBSET_RESULT" "success"
          assert_eq "select-subset verdict" "$SUBSET_VERDICT" "passed"
          echo "selftest summary: happy=$HAPPY_VERDICT subset=$SUBSET_VERDICT"
          {
            echo "## Selftest outcomes"
            echo ""
            echo "happy-path=$HAPPY_VERDICT, select-subset=$SUBSET_VERDICT."
            echo "The designed-failure calls live in selftest-guardrails.yml"
            echo "(dispatch-only, red by construction) and are exercised"
            echo "routinely by the selftest-negative.yml watchdog."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  # The template must satisfy its own structural-budget standards under
  # the enforcement flag: the strict profile passes --enforce-bloat to the
  # detector, so the dogfood scan must stay green with escalation armed.
  enforce-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-scan under --enforce-bloat
        run: |
          python3 scripts/ai_slop_detector.py . --max-score 8 --enforce-bloat
