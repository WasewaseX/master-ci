# =============================================================================
# Autofix - the "find it, fix it" loop
# =============================================================================
# Problems are found by CI (every push), the Deep Audit (whole-repo sweep)
# and the Nightly Deep Scan. This workflow is their common response: it
# applies the repo's own fix policy via scripts/fix_engine.py - the same
# engine the reactive Self-Heal loop uses - and opens one reviewable PR.
#
#   found by CI      -> Self-Heal (heal.yml) -> fix engine
#   found by audit   -> this workflow, right after the audit completes
#   found by drift   -> this workflow, every Monday morning
#
# Fix policy lives in scripts/fix_engine.py (tiers: safe = formatting,
# lint = tool-verified transforms). Secrets, vulnerability upgrades and
# AI-integrity prose findings are never auto-fixed: they need humans and
# are tracked in the audit issue instead.
#
# Circuit breakers:
#   - one concurrency group, never parallel
#   - all changes land as a PR; closing it is the rollback
#   - Master CI re-runs on the PR branch; merge only with green CI
#
# PRs created with GITHUB_TOKEN intentionally do not re-trigger workflows.
# To have Master CI run on the autofix PR automatically, store a PAT with
# `repo` + `workflow` scopes as the AUTOFIX_TOKEN repository secret.
# =============================================================================

name: Autofix

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC - the weekly drift sweep
  # zizmor: ignore[dangerous-triggers] - reacts to the Deep Audit sweep on
  # the default branch only; no untrusted checkout, no push, PR-only changes
  workflow_run:
    workflows: ["Deep Audit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      semgrep_config:
        description: 'Semgrep packs for --autofix (empty skips semgrep)'
        required: false
        type: string
        default: 'p/default p/security-audit p/secrets'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEMGREP_INPUT: ${{ inputs.semgrep_config }}
      AUDIT_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fix tools
        run: |
          python -m pip install --quiet ruff sqlfluff semgrep

      - name: Apply the fix policy
        run: |
          cfg="${SEMGREP_INPUT:-p/default p/security-audit p/secrets}"
          # reports live outside the worktree: they must never leak into
          # the fix PR itself (RUNNER_TEMP is runner-local scratch space)
          python3 scripts/fix_engine.py \
            --tier safe --tier lint \
            --semgrep-config "$cfg" \
            --manifest-dir "$RUNNER_TEMP/fix"

      - name: Assemble the PR body
        run: |
          {
            if [ -n "$AUDIT_RUN_URL" ]; then
              echo "Response to the Deep Audit run: $AUDIT_RUN_URL."
              echo "Mechanically fixable findings are applied below;"
              echo "the rest stays in the audit tracking issue."
              echo
            fi
            cat "$RUNNER_TEMP/fix/pr-body.md"
          } > "$RUNNER_TEMP/fix/final-body.md"
          cat "$RUNNER_TEMP/fix/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the autofix PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
          branch: ci/autofix
          title: 'ci: automated fixes from the audit and drift sweeps'
          body-file: "$RUNNER_TEMP/fix/final-body.md"
          labels: |
            automation
            autofix
          commit-message: 'ci: apply the master-ci fix policy'
