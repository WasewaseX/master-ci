# =============================================================================
# Mutation Testing - weekly proof that the tests can fail
# =============================================================================
# Roadmap item 4's second half: coverage says which lines ran; mutation
# says whether the assertions would notice a defect. Full mutation runs
# are too slow for every push, so this is the scheduled counterpart to
# the PR-time coverage gate.
#
# Opt-in by declaration: the job runs EVERY declared tool, independently.
# mutmut when pyproject.toml declares [tool.mutmut] (or setup.cfg
# [mutmut]), Stryker when any valid Stryker config filename is committed
# (stryker.conf.*, stryker.config.*, .stryker.conf.*, .stryker.config.* -
# json/js/mjs/cjs), cargo-mutants when .cargo-mutants.toml is committed,
# and gremlins when .gremlins.yaml (or gremlins.yaml) is committed. The
# declarations are not mutually exclusive: the first-match chain this
# file shipped before v2.11 meant a ten-stack repo declaring [tool.mutmut]
# could never mutate its Go or Rust code, and three of the four
# ecosystems had no hosted evidence anywhere. A repo without any of
# those configs skips - and a tool that exits nonzero on surviving
# mutants fails the run, which is the weekly signal to review the tests.
# New installs are pinned through configs/tool-versions.yml, the same
# trust class as every other analyzer in the template, and the project's
# own dependencies are installed first: a fresh runner without them
# would measure mutants against a bare environment, which reports false
# survivors (or false kills).
#
# Since v2.9 this workflow is also a reusable workflow: a consumer calls
# it from its own scheduled (or dispatched) wrapper, because a called
# workflow cannot carry a schedule trigger:
#   uses: WasewaseX/master-ci/.github/workflows/mutation.yml@v2.9.0
# The helper defaults follow the codeql.yml contract - template_repo is
# explicit so a cross-repo call never fetches helpers from the caller
# (GITHUB_WORKFLOW_REF names the caller's workflow there), and
# template_ref defaults to the moving v2 tag; pin an exact vX.Y.Z to
# freeze behavior. Opting in stays a declaration in the CALLING repo:
# the detection step reads the caller's checkout, so a call without a
# committed mutation config reports "nothing ran" and passes.
# ===============================================================================

name: Mutation Testing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_call:
    inputs:
      template_repo:
        description: Repo holding master-ci helpers (override for forks)
        required: false
        type: string
        default: WasewaseX/master-ci
      template_ref:
        description: >-
          Ref of template_repo to fetch helpers from. The v2 tag moves
          with every release; pin an exact vX.Y.Z tag to freeze behavior.
        required: false
        type: string
        default: v2
  workflow_dispatch:
    inputs:
      template_repo:
        description: Repo holding master-ci helpers (auto-detected when empty)
        required: false
        type: string
        default: ''
      template_ref:
        description: Ref of the master-ci repo to fetch helpers from
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEMPLATE_REPO_INPUT: ${{ inputs.template_repo }}
      TEMPLATE_REF: ${{ inputs.template_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate helper ref
        run: |
          case "$TEMPLATE_REF" in
            -*|*..*|*[!A-Za-z0-9._/-]*)
              echo "::error::template_ref contains unsafe characters or sequences"
              exit 1 ;;
          esac
      - name: Resolve helper repo
        id: repo
        run: |
          fallback='WasewaseX/master-ci'
          if [ -n "$TEMPLATE_REPO_INPUT" ]; then
            echo "template_repo=$TEMPLATE_REPO_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${GITHUB_WORKFLOW_REF:-}"
          parsed="${ref%%/.github/*}"
          if [ -n "$parsed" ] && [ "$parsed" != "$ref" ]; then
            echo "template_repo=$parsed" >> "$GITHUB_OUTPUT"
          else
            echo "template_repo=$fallback" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch master-ci helpers
        # The tool pins are versioned with the template; without this
        # fetch the version lookups would read the caller's tree, which
        # for a foreign consumer has no scripts/tool_versions.py at all
        # - the cargo-mutants and gremlins paths could never run there.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repo.outputs.template_repo }}
          ref: ${{ env.TEMPLATE_REF }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Detect mutation configs
        id: detect
        run: |
          # Opt-in by declaration, never by guessing: mutating code in a
          # repo that never asked for it would burn an hour of CI on noise.
          # Every filename Stryker resolves is accepted - stryker.conf.*,
          # stryker.config.* and their dot-prefixed twins, json/js/mjs/cjs.
          # Since v2.11 the four declarations are independent `if`s, not a
          # first-match chain: every declared tool runs. The if blocks
          # below ARE the canonical order: "mutmut", "stryker", "cargo-mutants", "gremlins".
          # The emitted JSON array is deterministic and drives the
          # per-tool steps that follow.
          declared=()
          if grep -q '^\[tool\.mutmut\]' pyproject.toml 2>/dev/null \
            || grep -q '^\[mutmut\]' setup.cfg 2>/dev/null; then
            declared+=("mutmut")
          fi
          # ls exits nonzero when ANY of its arguments is missing, so the
          # v2.6 `if ls stryker.conf.{json,...} ...` construct lied whenever
          # the repo committed exactly one config file (the common case) -
          # the same trap hid a .gremlins.yaml-only declaration. Found by
          # simulating this block against fixture trees; the -f loops
          # below test each candidate honestly.
          stryker_found=0
          for f in stryker.conf.{json,js,mjs,cjs} stryker.config.{json,js,mjs,cjs} \
            .stryker.conf.{json,js,mjs,cjs} .stryker.config.{json,js,mjs,cjs}; do
            if [ -f "$f" ]; then stryker_found=1; break; fi
          done
          if [ "$stryker_found" = "1" ]; then
            declared+=("stryker")
          fi
          if [ -f .cargo-mutants.toml ]; then
            declared+=("cargo-mutants")
          fi
          gremlins_found=0
          for f in .gremlins.yaml gremlins.yaml; do
            if [ -f "$f" ]; then gremlins_found=1; break; fi
          done
          if [ "$gremlins_found" = "1" ]; then
            declared+=("gremlins")
          fi
          # pure-bash JSON emission: no jq/python dependency in detection,
          # and an empty array is exactly the documented opt-out ("[]")
          tools='['
          first=1
          for tool in "${declared[@]}"; do
            if [ "$first" = "1" ]; then first=0; else tools="$tools,"; fi
            tools="$tools\"$tool\""
          done
          tools="$tools]"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "Declared mutation tools: $tools"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'mutmut')
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch pin; no version tags published) # zizmor: ignore[ref-version-mismatch]
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'cargo-mutants')
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'gremlins')
        with:
          go-version: 'stable'
      - name: Install project dependencies (mutmut)
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'mutmut')
        run: |
          # mutmut drives the project's own pytest; a fresh runner without
          # the project's packages would measure mutants against a bare
          # environment. Install first, mirroring the python job's
          # install contract - a packaging failure must fail loudly here
          # too, never leave the run measuring an environment that
          # happens to pass.
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e . || pip install .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No installable python project - tests run against the bare environment"
          fi
      - name: Mutate (mutmut)
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'mutmut')
        run: |
          # the pin emits name==version and is meant to word-split:
          # shellcheck disable=SC2046
          python -m pip install --quiet $(python3 _ci/scripts/tool_versions.py pip mutmut)
          mutmut run
          # Survivors are the deliverable: hand reviewers the list, then
          # the nonzero exit from `mutmut run` has already failed the job.
          mutmut results | tee mutmut-results.txt
      - name: Install project dependencies (Stryker)
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'stryker')
        run: |
          # Stryker's test-runner plugin comes from the project's own
          # dependencies; a fresh runner without node_modules cannot run
          # the configured test runner at all. Lockfile is a contract,
          # same as the node jobs.
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then yarn install --immutable
          elif [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          else echo "No package manifest - Stryker runs from the pinned npx install alone"
          fi
      - name: Mutate (Stryker)
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'stryker')
        run: npx --yes "$(python3 _ci/scripts/tool_versions.py npm @stryker-mutator/core)" run
      - name: Mutate (cargo-mutants)
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'cargo-mutants')
        run: |
          cargo install --locked --quiet cargo-mutants \
            --version "$(python3 _ci/scripts/tool_versions.py cargo cargo-mutants)"
          cargo mutants
          # Exit codes verified against the tool's contract: 0 = every
          # viable mutant caught, 2 = survivors found. Survivors fail
          # the job; mutants.out carries the per-mutant evidence.
          find mutants.out -name '*.json' -type f | head -50 || true
      - name: Mutate (gremlins)
        if: contains(fromJSON(steps.detect.outputs.tools || '[]'), 'gremlins')
        run: |
          go install "github.com/go-gremlins/gremlins/cmd/gremlins@$(python3 _ci/scripts/tool_versions.py go gremlins)"
          # The .gremlins.yaml that opted this repo in is also the gate:
          # unleash exits 10 / 11 when the configured unleash.threshold
          # efficacy / mutant-coverage floors are breached (verified
          # against gremlins v0.6.0; unset thresholds never trip). The
          # config file is the gate - without thresholds the run reports
          # efficacy but never fails.
          gremlins unleash
      - name: Upload survivor report
        if: always() && contains(fromJSON(steps.detect.outputs.tools || '[]'), 'mutmut') && hashFiles('mutmut-results.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-survivors
          path: mutmut-results.txt
          if-no-files-found: ignore
      - name: Upload Stryker reports
        if: always() && contains(fromJSON(steps.detect.outputs.tools || '[]'), 'stryker') && hashFiles('reports/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-stryker-reports
          path: reports/
          if-no-files-found: ignore
      - name: Upload cargo-mutants evidence
        if: always() && contains(fromJSON(steps.detect.outputs.tools || '[]'), 'cargo-mutants') && hashFiles('mutants.out/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-cargo-mutants-out
          path: mutants.out/
          if-no-files-found: ignore
      - name: Summary
        if: always()
        env:
          TOOLS: ${{ steps.detect.outputs.tools }}
        run: |
          {
            echo "## Mutation testing"
            echo ""
            if [ "$TOOLS" = "[]" ] || [ -z "$TOOLS" ]; then
              echo "No mutation config declared - opt in with [tool.mutmut] in"
              echo "pyproject.toml, a Stryker config (stryker.conf.* or"
              echo "stryker.config.*, json/js/mjs/cjs), a .cargo-mutants.toml or"
              echo "a .gremlins.yaml. Nothing ran; this is not a pass or a fail."
            else
              for tool in $(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$TOOLS"); do
                case "$tool" in
                  mutmut)
                    echo "- **mutmut** ran; surviving mutants (if any) are listed above and in"
                    echo "  the mutation-survivors artifact. Each survivor is an assertion"
                    echo "  gap: a defect that shape would ship unnoticed." ;;
                  stryker)
                    echo "- **Stryker** ran; the HTML report is in the mutation-stryker-reports"
                    echo "  artifact. A low mutation score means the tests execute code but"
                    echo "  do not verify behavior." ;;
                  cargo-mutants)
                    echo "- **cargo-mutants** ran; the per-mutant evidence is in the"
                    echo "  mutation-cargo-mutants-out artifact. Every surviving mutant is"
                    echo "  a code change no test noticed (exit 2 = survivors found)." ;;
                  gremlins)
                    echo "- **gremlins** ran with the thresholds declared in .gremlins.yaml;"
                    echo "  exit 10 / 11 means the efficacy or mutant-coverage floor was"
                    echo "  breached - the tests kill too few of the mutants they run." ;;
                esac
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
