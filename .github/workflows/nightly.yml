# =============================================================================
# Nightly Deep Scan - scheduled full sweep
# =============================================================================
# Runs the checks that are too loud for every push: full-severity Trivy,
# CodeQL quality suites and a verbose AI-integrity report, collected into
# one step summary.
# =============================================================================

name: Nightly Deep Scan

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    with:
      languages: python
    permissions:
      contents: read
      security-events: write

  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Full Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - name: Deep AI-integrity scan
        run: |
          python3 scripts/ai_slop_detector.py . --max-score 8 --enforce-bloat --report-file /tmp/ai_report.md
          cat /tmp/ai_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Nightly summary
        run: |
          {
            echo "## Nightly deep scan"
            echo ""
            echo "- Full-severity Trivy (vulns, secrets, misconfig)"
            echo "- CodeQL security-and-quality on schedule"
            echo "- AI-integrity report above"
            echo ""
            echo "Review findings and file issues for anything worth tracking."
          } >> "$GITHUB_STEP_SUMMARY"
