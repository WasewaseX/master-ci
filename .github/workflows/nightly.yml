# =============================================================================
# Nightly Deep Scan - scheduled full sweep
# =============================================================================
# Runs the checks that are too loud for every push: full-severity Trivy,
# CodeQL quality suites and a verbose AI-integrity report, collected into
# one step summary.
# =============================================================================

name: Nightly Deep Scan

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml
    with:
      languages: python
    permissions:
      contents: read
      security-events: write

  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Full Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - name: Deep AI-integrity scan
        run: |
          python3 scripts/ai_slop_detector.py . --max-score 8 --report-file /tmp/ai_report.md
          cat /tmp/ai_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Nightly summary
        run: |
          {
            echo "## Nightly deep scan"
            echo ""
            echo "- Full-severity Trivy (vulns, secrets, misconfig)"
            echo "- CodeQL security-and-quality on schedule"
            echo "- AI-integrity report above"
            echo ""
            echo "Review findings and file issues for anything worth tracking."
          } >> "$GITHUB_STEP_SUMMARY"
