# =============================================================================
# Expected-failure watchdog - the negative selftest paths, run routinely
# =============================================================================
# Red in CI may only ever mean broken, so the five designed-failure calls
# (unreachable semgrep pack, traversal template_ref, typo'd stack toggle,
# unknown select job, foreign helper with an empty template_ref) live in
# their own dispatch-only workflow, selftest-guardrails.yml, whose red runs
# are correct by construction. A reusable-workflow caller job has no
# continue-on-error, so isolation is the only way to keep a designed
# failure from reddening a routine run.
#
# This watchdog makes that designed red ROUTINE instead of
# never-dispatched:
#   1. dispatch selftest-guardrails.yml on main
#   2. wait for the child run to finish - it MUST conclude red
#   3. assert the red is exactly the designed red:
#        enforced-failure / input-validation /
#        input-validation-stack-toggle /
#        input-validation-select /
#        input-validation-template-ref             -> inner jobs fail
#        verify                                    -> success
#      If the child run is green, the guardrails did not fail - a
#      validation rule is gone. If verify failed, a guardrail fired in the
#      wrong way. Either way this harness exits non-zero; only the correct
#      red passes.
#
# Triggers: pushes to main that touch the test bed, a weekly schedule, and
# manual dispatch. The dispatched child run appears red in the Actions list
# under the name "Selftest Guardrails" - that is the point, and its name
# says so.
# =============================================================================

name: Selftest Negative Harness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-ci.yml'
      - '.github/workflows/selftest.yml'
      - '.github/workflows/selftest-negative.yml'
      - '.github/workflows/selftest-guardrails.yml'
      - 'tests/**'
  schedule:
    - cron: '30 4 * * 0' # Sundays 04:30 UTC, right after the Benchmark slot
  workflow_dispatch:

permissions:
  contents: read
  actions: write # dispatch selftest-guardrails.yml and read its runs

concurrency:
  group: selftest-negative
  cancel-in-progress: false # a started child run must be observed to the end

jobs:
  negative-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dispatch the guardrails suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # -R because this job has no checkout; the API is all we need
          gh workflow run selftest-guardrails.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "dispatched at $before" | tee dispatch-time.txt
          sleep 10 # let GitHub register the run
      - name: Wait for the (designed-red) child run
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dispatched_at=$(sed 's/dispatched at //' dispatch-time.txt)
          run_id=""
          for _ in $(seq 1 12); do
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/selftest-guardrails.yml/runs?event=workflow_dispatch&created=%3E%3D${dispatched_at}&per_page=5" \
              --jq '.workflow_runs | map(select(.head_branch == "main")) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::could not find the dispatched guardrails run"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 80); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)
            [ "$status" = "completed" ] && break
            sleep 30
          done
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)
          echo "child run ${run_id} conclusion: ${conclusion}"
          if [ "$conclusion" != "failure" ]; then
            echo "::error::guardrails run concluded '${conclusion}' - the designed failures did NOT fail (a guardrail is gone; the gate is broken)"
            exit 1
          fi
      - name: Assert the red is exactly the designed red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        run: |
          # --paginate: a full child run has 100+ jobs. Reusable-workflow
          # CALL jobs never appear as caller-level entries in the jobs API -
          # only their inner jobs, named "caller / inner". So the caller
          # outcome is derived from its inner jobs (a called run fails when
          # any of its jobs fail), while regular jobs (verify) come through
          # directly.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.name)=\(.conclusion)"' > jobs.txt
          wc -l jobs.txt
          python3 - <<'EOF'
          import sys

          caller_jobs: dict[str, list[str]] = {}
          plain: dict[str, str] = {}
          for line in open("jobs.txt"):
              line = line.strip()
              if line and "=" in line:
                  name, _, conclusion = line.partition("=")
                  if " / " in name:
                      caller, inner = name.split(" / ", 1)
                      caller_jobs.setdefault(caller, []).append(conclusion)
                  else:
                      plain[name] = conclusion

          expected_failure = [
              "enforced-failure",
              "input-validation",
              "input-validation-stack-toggle",
              "input-validation-select",
              "input-validation-template-ref",
          ]
          expected_success = ["verify"]

          problems = []
          for name in expected_failure:
              inner = caller_jobs.get(name)
              if not inner:
                  problems.append(f"{name}: never ran (no inner jobs found)")
              elif "failure" not in inner:
                  problems.append(
                      f"{name}: expected failure, inner conclusions = {sorted(set(inner))}"
                  )
          for name in expected_success:
              if plain.get(name) != "success":
                  problems.append(f"{name}: expected success, got {plain.get(name)}")
          if problems:
              print("expected-failure harness FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("expected-failure harness PASS: designed red, all 5 guardrails fired and verify succeeded")
          EOF
      - name: Summarize
        if: always()
        env:
          RUN_URL: ${{ steps.wait.outputs.run_id != '' && format('https://github.com/{0}/actions/runs/{1}', github.repository, steps.wait.outputs.run_id) || 'not dispatched' }}
        run: |
          {
            echo "## Expected-failure watchdog"
            echo ""
            echo "Child guardrails run: $RUN_URL"
            echo ""
            echo "A red child run named \"Selftest Guardrails\" + this green"
            echo "watchdog = the negative paths work. Red anywhere else = broken."
          } >> "$GITHUB_STEP_SUMMARY"
