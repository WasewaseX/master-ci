# =============================================================================
# Expected-failure harness - the negative selftest paths, run routinely
# =============================================================================
# selftest.yml contains four calls that are DESIGNED to fail (unreachable
# semgrep pack, traversal template_ref, typo'd stack toggle, unknown select
# job). A workflow run cannot stay green while its own jobs fail - GitHub
# colors the whole run red - so those calls used to be gated behind a
# manual `failure_paths=true` dispatch and effectively never ran.
#
# This harness turns that red into a pass signal:
#   1. dispatch selftest.yml with failure_paths=true on main
#   2. wait for the child run to finish (it IS red, by design)
#   3. assert every job concluded exactly as designed:
#        happy-path / select-subset / verify        -> success
#        enforced-failure / input-validation /
#        input-validation-stack-toggle /
#        input-validation-select                    -> failure
#      If the child run is green, the negative paths did not fail - the
#      gate is broken. If a job failed in the wrong way, the gate lied.
#      Either way this harness exits non-zero; only a correct red passes.
#
# Triggers: pushes to main that touch the workflow or its test bed, a
# weekly schedule, and manual dispatch. The child selftest run appears red
# in the Actions list - that is the point, and it is contained there.
# =============================================================================

name: Selftest Negative Harness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-ci.yml'
      - '.github/workflows/selftest.yml'
      - '.github/workflows/selftest-negative.yml'
      - 'tests/**'
  schedule:
    - cron: '30 4 * * 0' # Sundays 04:30 UTC, right after the Benchmark slot
  workflow_dispatch:

permissions:
  contents: read
  actions: write # dispatch selftest.yml and read its runs

concurrency:
  group: selftest-negative
  cancel-in-progress: false # a started child run must be observed to the end

jobs:
  negative-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dispatch selftest with failure_paths=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run selftest.yml --ref main -f failure_paths=true
          echo "dispatched at $before" | tee dispatch-time.txt
          sleep 10 # let GitHub register the run
      - name: Wait for the (intentionally red) child run
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dispatched_at=$(sed 's/dispatched at //' dispatch-time.txt)
          run_id=""
          for _ in $(seq 1 12); do
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/selftest.yml/runs?event=workflow_dispatch&created=%3E%3D${dispatched_at}&per_page=5" \
              --jq '.workflow_runs | map(select(.head_branch == "main")) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::could not find the dispatched selftest run"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 80); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)
            [ "$status" = "completed" ] && break
            sleep 30
          done
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)
          echo "child run ${run_id} conclusion: ${conclusion}"
          if [ "$conclusion" != "failure" ]; then
            echo "::error::child selftest run concluded '${conclusion}' - the designed failures did NOT fail (gate is broken)"
            exit 1
          fi
      - name: Assert every job concluded exactly as designed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs | map({(.name): .conclusion}) | add' > jobs.json
          cat jobs.json
          python3 - <<'EOF'
          import json, sys

          jobs = json.load(open("jobs.json"))
          expected = {
              "happy-path": "success",
              "select-subset": "success",
              "verify": "success",
              "enforced-failure": "failure",
              "input-validation": "failure",
              "input-validation-stack-toggle": "failure",
              "input-validation-select": "failure",
          }
          problems = []
          for name, want in expected.items():
              got = jobs.get(name)
              if got != want:
                  problems.append(f"{name}: expected {want}, got {got}")
          # inner jobs of the called reusable workflow appear as
          # "happy-path / hygiene" etc - only exact top-level names matter here
          if problems:
              print("expected-failure harness FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("expected-failure harness PASS: all 7 jobs concluded exactly as designed")
          EOF
      - name: Summarize
        if: always()
        env:
          RUN_URL: ${{ steps.wait.outputs.run_id != '' && format('https://github.com/{0}/actions/runs/{1}', github.repository, steps.wait.outputs.run_id) || 'not dispatched' }}
        run: |
          {
            echo "## Expected-failure harness"
            echo ""
            echo "Child selftest run: $RUN_URL"
            echo ""
            echo "Red child run + this green harness = the negative paths work."
          } >> "$GITHUB_STEP_SUMMARY"
