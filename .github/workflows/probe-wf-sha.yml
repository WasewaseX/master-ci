name: Probe WF SHA
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Caller context
        env:
          WF_SHA: ${{ github.workflow_sha }}
          WF_REF: ${{ github.workflow_ref }}
          GHA_SHA: ${{ github.sha }}
        run: |
          echo "caller workflow_sha=$WF_SHA"
          echo "caller workflow_ref=$WF_REF"
          echo "caller github.sha=$GHA_SHA"
  callee:
    uses: ./.github/workflows/probe-callee.yml
