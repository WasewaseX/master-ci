# =============================================================================
# Benchmark - weekly performance tracking of the core engines
# =============================================================================
# Runs scripts/benchmark.py against a deterministic synthetic corpus and
# publishes the numbers three ways:
#   1. the step summary (human readable, every run)
#   2. a downloadable artifact (90-day retention)
#   3. benchmarks/history.jsonl on the dedicated `benchmarks` branch - one
#      JSON line per run. The branch is unprotected ON PURPOSE: main
#      requires the ci-success check, which a GITHUB_TOKEN push cannot
#      satisfy, and the project rule "automation never pushes main" stands.
#      The hosted history survives artifact expiry and is diffable with
#      plain git: git log -p benchmarks/history.jsonl
# Report-only by design: shared runners are too noisy to fail a build on
# timings, but a week-over-week jump (e.g. detector slowing down) shows up
# immediately in the history diff. Locally, use --save/--check for strict
# gates:
#   python3 scripts/benchmark.py --save baseline.json
#   python3 scripts/benchmark.py --check baseline.json
# =============================================================================

name: Benchmark

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC - its own slot, away from the other loops
  workflow_dispatch:

permissions:
  contents: write # append benchmarks/history.jsonl to the benchmarks branch

concurrency:
  group: benchmark-history
  cancel-in-progress: false # never drop a history line mid-append

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # the history append pushes to main; a full fetch keeps the rebase honest
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install runtime dependency (path_filters reads YAML)
        run: python3 -m pip install --quiet pyyaml
      - name: Run benchmark (full corpus, best of 3)
        run: |
          python3 scripts/benchmark.py --repeat 3 --json bench.json \
            --append benchmarks/history.jsonl > bench.md
          {
            echo "## Engine benchmark"
            echo ""
            cat bench.md
            echo ""
            echo "Report-only: compare week over week on the benchmarks branch."
            echo "Strict gating is available locally via --save / --check (see the workflow header)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: bench.json
          retention-days: 90
      - name: Commit history line to the benchmarks branch
        run: |
          git config user.name "master-ci-bench"
          git config user.email "actions@users.noreply.github.com"
          cp benchmarks/history.jsonl /tmp/this-run.jsonl
          # main is protected (required ci-success check) - history goes to
          # the dedicated benchmarks branch instead
          if git ls-remote --exit-code --heads origin benchmarks >/dev/null 2>&1; then
            git fetch origin benchmarks
            git checkout -B benchmarks FETCH_HEAD
            cat /tmp/this-run.jsonl >> benchmarks/history.jsonl
          else
            git checkout -B benchmarks
            git rm -rq --cached .
            mkdir -p benchmarks
            cp /tmp/this-run.jsonl benchmarks/history.jsonl
          fi
          sort -u -o benchmarks/history.jsonl benchmarks/history.jsonl
          git add benchmarks/history.jsonl
          if git diff --cached --quiet; then
            echo "no new history line to commit"
            exit 0
          fi
          git commit -m "benchmark: hosted run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin benchmarks
