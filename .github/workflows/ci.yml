# =============================================================================
# CI - this repository eats its own cooking ("self loop")
# =============================================================================
# The template runs the exact same reusable workflows it ships to consumers,
# on every push and pull request. If master-ci is broken, this repo goes red
# before any downstream project notices.
#
# Extra jobs below test the template itself: fixtures exercise the detector
# and local tooling against edge-case projects (empty, malformed, vulnerable).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  master:
    # `$/` self-repository syntax would be stricter, but actionlint 1.7.x
    # cannot parse it yet; `./` resolves from this repo's checkout.
    # The template holds its own PRs to the full AI-integrity bar
    # (blocking score AND the slop-score ceiling) - eat your own cooking.
    uses: ./.github/workflows/master-ci.yml # zizmor: ignore[self-repository]
    with:
      fail_on_ai_slop: true
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  codeql:
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    with:
      languages: python
    permissions:
      contents: read
      security-events: write

  fixtures:
    name: Fixture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detector unit tests (incl. edge cases)
        run: |
          # the scanner dependency group (pyproject [dependency-groups]):
          # parse-backed tests degrade gracefully without these, but this
          # job exists to test the detector contract at full strength
          # tool_versions.py prints a package list; splitting is the point.
          # shellcheck disable=SC2046
          python -m pip install --quiet \
            pytest \
            $(python3 scripts/tool_versions.py pip lizard tree-sitter tree-sitter-language-pack)
          python -m pytest -q tests/
      - name: Fixture - empty project passes
        run: |
          python3 scripts/ai_slop_detector.py fixtures/empty-project --max-score 8
      - name: Fixture - empty project passes with structural-budget enforcement
        run: |
          python3 scripts/ai_slop_detector.py fixtures/empty-project --max-score 8 --enforce-bloat
      - name: Fixture - prose-heavy project is advisory only
        run: |
          python3 scripts/ai_slop_detector.py fixtures/prose-heavy --max-score 0
      - name: Fixture - ignore file suppresses findings
        run: |
          python3 scripts/ai_slop_detector.py fixtures/ignore-me --max-score 0
      - name: Fixture - slop code is detected and blocking
        run: |
          if python3 scripts/ai_slop_detector.py fixtures/slop-code --max-score 0; then
            echo "detector failed to flag slop" >&2
            exit 1
          fi
      - name: Fixture - malformed YAML is reported, not crashed on
        run: |
          pip install --quiet yamllint
          # default config on purpose: the repo config ignores fixtures/
          if yamllint fixtures/broken-yaml/; then
            echo "yamllint failed to report malformed YAML" >&2
            exit 1
          fi
