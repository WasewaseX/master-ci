# =============================================================================
# CI - this repository eats its own cooking ("self loop")
# =============================================================================
# The template runs the exact same reusable workflows it ships to consumers,
# on every push and pull request. If master-ci is broken, this repo goes red
# before any downstream project notices.
#
# Extra jobs below test the template itself: fixtures exercise the detector
# and local tooling against edge-case projects (empty, malformed, vulnerable).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  master:
    uses: ./.github/workflows/master-ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  codeql:
    uses: ./.github/workflows/codeql.yml
    with:
      languages: python
    permissions:
      contents: read
      security-events: write

  fixtures:
    name: Fixture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Detector unit tests (incl. edge cases)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/
      - name: Fixture - empty project passes
        run: |
          python3 scripts/ai_slop_detector.py fixtures/empty-project --max-score 8
      - name: Fixture - prose-heavy project is advisory only
        run: |
          python3 scripts/ai_slop_detector.py fixtures/prose-heavy --max-score 0
      - name: Fixture - ignore file suppresses findings
        run: |
          python3 scripts/ai_slop_detector.py fixtures/ignore-me --max-score 0
      - name: Fixture - slop code is detected and blocking
        run: |
          if python3 scripts/ai_slop_detector.py fixtures/slop-code --max-score 0; then
            echo "detector failed to flag slop" >&2
            exit 1
          fi
      - name: Fixture - malformed YAML is reported, not crashed on
        run: |
          pip install --quiet yamllint
          # default config on purpose: the repo config ignores fixtures/
          if yamllint fixtures/broken-yaml/; then
            echo "yamllint failed to report malformed YAML" >&2
            exit 1
          fi
