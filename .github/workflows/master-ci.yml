  # ---------------------------------------------------------------------------
  # Repo hygiene: workflows, YAML, shell, whitespace, duplication
  # ---------------------------------------------------------------------------
  hygiene:
    needs: [changes, meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',hygiene,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    env:
      CODE_CHANGED: ${{ needs.changes.outputs.code }}
      DUP_THRESHOLD: ${{ inputs.duplication_threshold_pct }}
      DUP_ENFORCE: ${{ needs.meta.outputs.enforce_duplication }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Lint workflow files (actionlint)
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          level: error
          fail_level: error
      - name: Default zizmor policy (if absent)
        # Consumers call Master CI by release tag - the documented setup -
        # which zizmor's default unpinned-uses policy scores as a high
        # finding. Ship a policy that keeps hash-pin for everything else
        # and allows ref-pin for the template's own workflows. Commit your
        # own .github/zizmor.yml to take full control.
        run: |
          [ -f .github/zizmor.yml ] || { mkdir -p .github && cp _ci/configs/zizmor.yml .github/zizmor.yml; }
      - name: Audit workflow security (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: regular
          min-severity: low
          min-confidence: medium
          # findings surface as step annotations; uploading SARIF would
          # require security-events: write on this job
          advanced-security: false
      - name: Lint YAML
        run: |
          pip install --quiet "$(python3 _ci/scripts/tool_versions.py pip yamllint)"
          yamllint -s -c _ci/configs/.yamllint.yaml .
      - name: Check editorconfig compliance
        # the pip package is legacy and no longer builds on Python 3.13;
        # download the maintained release binary directly (with retries)
        run: |
          [ -f .editorconfig ] || cp _ci/configs/.editorconfig .
          DL_OK=0
          for _attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 4 --retry-delay 4 --retry-all-errors -o /tmp/ec.tar.gz \
              https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v4.0.2/editorconfig-checker-linux-amd64.tar.gz; then DL_OK=1; break; fi
            echo "download attempt $_attempt failed; backing off 45s"
            sleep 45
          done
          [ "$DL_OK" = "1" ] || { echo '::error::editorconfig-checker download failed after 6 attempts'; exit 1; }
          tar -xzf /tmp/ec.tar.gz -C /tmp
          chmod +x /tmp/editorconfig-checker
          /tmp/editorconfig-checker
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts - skipping"
            exit 0
          fi
          command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y -qq shellcheck
          shellcheck "${files[@]}"
      - name: Flag oversized files
        run: |
          big=$(find . -type f -size +2M \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './_ci/*' -not -path './vendor/*' \
            -not -name '*.lock' -not -name '*-lock.json' | cut -c3- || true)
          if [ -n "$big" ]; then
            while IFS= read -r f; do
              echo "::warning file=$f::File larger than 2MB - commit smaller assets or use LFS"
            done <<< "$big"
          fi
      - name: Detect duplicated code
        if: env.CODE_CHANGED == 'true'
        run: |
          # jscpd: exact pin from configs/tool-versions.yml - a new
          # release must never change duplication behavior mid-CI
          if npx --yes "$(python3 _ci/scripts/tool_versions.py npm jscpd)" --silent --min-tokens 50 --threshold "$DUP_THRESHOLD" \
            --reporters console \
            --ignore "**/_ci/**,**/fixtures/**,**/node_modules/**,**/.git/**,**/dist/**,**/build/**,**/target/**" .; then
            exit 0
          fi
          if [ "$DUP_ENFORCE" = "true" ]; then
            exit 1
          fi
          echo "::warning::duplicated code above ${DUP_THRESHOLD}% (advisory in this profile)"

  # ---------------------------------------------------------------------------
  # Secrets: full-history leak detection
  # ---------------------------------------------------------------------------
  secrets:
    needs: [meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',secrets,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan git history for secrets (gitleaks)
        # gitleaks-action v3 requires a paid license for organizations;
        # the checksum-pinned CLI keeps the same full-history scan
        # license-free. Commit a .gitleaks.toml to tune the rules.
        run: |
          DL_OK=0
          for _attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 4 --retry-delay 4 --retry-all-errors -o /tmp/gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz; then DL_OK=1; break; fi
            echo "download attempt $_attempt failed; backing off 45s"
            sleep 45
          done
          [ "$DL_OK" = "1" ] || { echo '::error::gitleaks download failed after 6 attempts'; exit 1; }
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1 --verbose

  # ---------------------------------------------------------------------------
  # AI integrity: slop vocabulary, AI-text tells, humanizer patterns.
  # Advisory by default: prose style never fails a build; blocking signals
  # are deterministic content checks only.
  # ---------------------------------------------------------------------------
  ai-integrity:
    needs: [meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',ai-integrity,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      AI_MAX: ${{ needs.meta.outputs.ai_slop_max }}
      AI_CEILING: ${{ needs.meta.outputs.ai_slop_ceiling }}
      FAIL_SLOP: ${{ needs.meta.outputs.fail_ai_slop }}
      ENFORCE_BLOAT: ${{ needs.meta.outputs.enforce_bloat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned parser tooling
        # The parser guarantee (v2.5): this scan advertises parse-backed
        # dimensions (god-function, cognitive complexity), so it runs
        # with the exact pinned analyzers and --require-parsers - a
        # missing analyzer is exit 2, never a silently weakened scan.
        run: |
          # the pin list is meant to word-split:
          # shellcheck disable=SC2046
          pip install --quiet $(python3 _ci/scripts/tool_versions.py pip lizard tree-sitter tree-sitter-language-pack)
      - name: Run AI-integrity heuristics
        run: |
          ENFORCE_ARGS=""
          if [ "$ENFORCE_BLOAT" = "true" ]; then
            ENFORCE_ARGS="--enforce-bloat"
          fi
          python3 _ci/scripts/ai_slop_detector.py . \
            --max-score "$AI_MAX" \
            --max-slop-score "$AI_CEILING" \
            $ENFORCE_ARGS \
            --require-parsers \
            --report-file ai_report.md \
            --sarif ai_integrity.sarif \
            --annotate
          rc=$?
          if [ -f ai_report.md ]; then
            echo "### AI integrity heuristics" >> "$GITHUB_STEP_SUMMARY"
            cat ai_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rc" -eq 2 ]; then
            # Fail-closed configuration errors (invalid architecture config,
            # unevaluable coverage gate) are never advisory: a gate that
            # could not be evaluated must fail the run.
            exit 2
          fi
          if [ "$FAIL_SLOP" != "true" ] && [ "$rc" -ne 0 ]; then
            echo "fail_on_ai_slop=false - reporting without failing"
            exit 0
          fi
          exit "$rc"
      - name: Upload AI-integrity SARIF
        if: always() && hashFiles('ai_integrity.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ai_integrity.sarif
          category: ai-integrity

  # ---------------------------------------------------------------------------
  # Coverage gate: measured test assurance, consumed after the stacks run.
  # Runs only when coverage_min > 0 AND at least one coverage-producing
  # stack actually ran: a commit that touched no code skips the stacks,
  # and "nothing changed" is not a coverage failure. When a stack ran
  # but produced no report, the gate fails closed (exit 2) - code
  # changed with nothing measuring it is exactly what the floor exists
  # to catch.
  # ---------------------------------------------------------------------------
  coverage-gate:
    needs: [meta, python, go-test, node-test]
    if: >-
      always() && needs.meta.result == 'success'
      && needs.python.result != 'failure'
      && needs.go-test.result != 'failure'
      && needs.node-test.result != 'failure'
      && (needs.python.result == 'success'
          || needs.go-test.result == 'success'
          || needs.node-test.result == 'success')
      && needs.meta.outputs.coverage_min != '0'
      && needs.meta.outputs.coverage_min != ''
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COVERAGE_MIN: ${{ needs.meta.outputs.coverage_min }}
      DIFF_BASE: ${{ needs.meta.outputs.diff_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Download coverage reports
        # continue-on-error: absent artifacts stay absent - the gate's own
        # fail-closed discovery is what reports a missing report (exit 2),
        # so the download must not mask it with its own error class.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-reports
      - name: Fetch diff base for the new-code gate
        # The new-code gate diffs against diff_base (merge-base); the
        # default shallow checkout does not carry other branches. The
        # shared helper materializes remote-tracking refs; the same
        # helper serves the new-code-gate job so both cannot drift.
        if: env.DIFF_BASE != ''
        run: bash _ci/scripts/fetch_diff_base.sh "$DIFF_BASE"
      - name: Evaluate coverage gates
        run: |
          GATE_ARGS=""
          while IFS= read -r report; do
            GATE_ARGS="$GATE_ARGS --coverage-report $report"
          done < <(find coverage-reports -type f \
            \( -name 'coverage.json' -o -name '*.xml' -o -name 'cover.out' \) 2>/dev/null)
          GATE_ARGS="$GATE_ARGS --min-coverage $COVERAGE_MIN"
          if [ -n "$DIFF_BASE" ]; then
            GATE_ARGS="$GATE_ARGS --min-new-coverage $COVERAGE_MIN --diff-base $DIFF_BASE"
          fi
          # Exit 1 = a floor is breached, exit 2 = the gate cannot be
          # evaluated (no report / corrupt report / fetch failure). Both
          # fail the run: a requested gate is a contract, not advice.
          python3 _ci/scripts/coverage_gate.py . $GATE_ARGS | tee gate-report.md
          rc=${PIPESTATUS[0]}
          if [ -f gate-report.md ]; then
            echo "### Coverage gate" >> "$GITHUB_STEP_SUMMARY"
            cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # New-code dimension ceilings: the merge-base diff must meet today's bar
  # ---------------------------------------------------------------------------
  new-code-gate:
    needs: [meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',new-code-gate,'))
      && needs.meta.result == 'success'
      && inputs.new_code_gates
      && needs.meta.outputs.diff_base != ''
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DIFF_BASE: ${{ needs.meta.outputs.diff_base }}
      MAX_SLOP: ${{ needs.meta.outputs.new_code_max_slop }}
      MAX_COGNITIVE: ${{ needs.meta.outputs.new_code_max_cognitive }}
      MAX_CYCLOMATIC: ${{ needs.meta.outputs.new_code_max_cyclomatic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned parser tooling
        # The parser guarantee (v2.5): the complexity ceilings promise
        # measurement. new_code_gate.py fails closed (exit 2) when an
        # analyzer is missing - this install makes the promise true on
        # the runner.
        run: |
          # the pin list is meant to word-split:
          # shellcheck disable=SC2046
          pip install --quiet $(python3 _ci/scripts/tool_versions.py pip lizard tree-sitter tree-sitter-language-pack)
      - name: Fetch diff base
        # The gate diffs against diff_base (merge-base); the shared
        # helper materializes the ref for a shallow checkout.
        run: bash _ci/scripts/fetch_diff_base.sh "$DIFF_BASE"
      - name: Evaluate new-code dimension ceilings
        # Legacy files keep their history; every added line meets
        # today's bar - blocking-score 0, cognitive 15, cyclomatic 15
        # by default (tunable via the new_code_* inputs). Exit 1 = a
        # ceiling is breached by the change, exit 2 = the gate cannot
        # be evaluated (no diff base, git failure). Both fail the run.
        run: |
          python3 _ci/scripts/new_code_gate.py . \
            --diff-base "$DIFF_BASE" \
            --max-slop-score "$MAX_SLOP" \
            --max-cognitive "$MAX_COGNITIVE" \
            --max-cyclomatic "$MAX_CYCLOMATIC" | tee new-code-report.md
          rc=${PIPESTATUS[0]}
          if [ -f new-code-report.md ]; then
            echo "### New-code gate" >> "$GITHUB_STEP_SUMMARY"
            cat new-code-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Quality ratchet: the committed baseline no check may regress from.
  # A .quality-baseline.json records per-check finding counts; any check
  # pushed above its count fails the run. auto runs only when the file
  # exists (opt-in by committing it); true demands the file - a missing
  # baseline cannot be interpreted, so the job fails closed (exit 2).
  # ---------------------------------------------------------------------------
  quality-ratchet:
    needs: [meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',quality-ratchet,'))
      && needs.meta.result == 'success'
      && needs.meta.outputs.ratchet != 'false'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RATCHET: ${{ needs.meta.outputs.ratchet }}
      RATCHET_FILE: ${{ needs.meta.outputs.ratchet_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned parser tooling
        # The parser guarantee (v2.5): a floor recorded with parsers
        # must be enforced with parsers - a missing analyzer would
        # silently count fewer findings and pass a regressed baseline.
        # --require-parsers turns that hole into exit 2.
        run: |
          # the pin list is meant to word-split:
          # shellcheck disable=SC2046
          pip install --quiet $(python3 _ci/scripts/tool_versions.py pip lizard tree-sitter tree-sitter-language-pack)
      - name: Resolve the baseline floor
        id: floor
        # hashFiles is not available in job-level if expressions, so the
        # auto-detection lives here. auto + no committed baseline = the
        # repo has not opted in: the job skips the enforce step via its
        # output (exit 0 ends a STEP, never the job). ratchet=true + no
        # baseline = a demanded contract that cannot be honored - fail
        # closed (exit 2), never a silent pass.
        run: |
          if [ ! -f "$RATCHET_FILE" ]; then
            if [ "$RATCHET" = "true" ]; then
              echo "::error::ratchet=true but $RATCHET_FILE is missing - record the floor with --write-quality-baseline or set ratchet=auto"
              exit 2
            fi
            echo "no $RATCHET_FILE committed - quality ratchet not opted in, skipping"
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enforce=true" >> "$GITHUB_OUTPUT"
      - name: Enforce the quality ratchet
        if: steps.floor.outputs.enforce == 'true'
        run: |
          # Exit 1 = a check regressed above its recorded count, exit 2 =
          # the baseline cannot be interpreted (invalid JSON, a schema or
          # catalog change). Both fail the run: a committed floor is a
          # contract, not advice. Paying debt and catalog adoption
          # re-record the floor with --write-quality-baseline in a
          # reviewed commit.
          python3 _ci/scripts/ai_slop_detector.py . \
            --quality-baseline "$RATCHET_FILE" \
            --require-parsers | tee ratchet-report.md
          rc=${PIPESTATUS[0]}
          if [ -s ratchet-report.md ]; then
            echo "### Quality ratchet" >> "$GITHUB_STEP_SUMMARY"
            cat ratchet-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Documentation: markdown lint
  # ---------------------------------------------------------------------------
  docs:
    needs: [changes, meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',docs,')) && needs.meta.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Lint markdown
        run: |
          [ -f .markdownlint-cli2.jsonc ] || cp _ci/configs/.markdownlint-cli2.jsonc .
          npx --yes "$(python3 _ci/scripts/tool_versions.py npm markdownlint-cli2)" "**/*.md" "!**/node_modules/**" \
            "!**/_ci/**" "!**/fixtures/**" "!**/dist/**" "!**/build/**"

  # ---------------------------------------------------------------------------
  # Node / TypeScript stack: lint, format, types, unused deps
  # ---------------------------------------------------------------------------
  node-lint:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',node-lint,'))
      && needs.meta.result == 'success'
      && ((inputs.run_node == 'auto' && needs.changes.outputs.node == 'true') || inputs.run_node == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        # Helper checkout moves ahead of discovery: workspace-aware Node
        # analysis needs the template's project inventory script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Node projects
        # Nested package.json manifests used to trigger this job and then
        # skip silently ("root-manifest-only analysis"). Discovery makes every
        # project explicit; --fail-empty turns a missing inventory into a
        # loud failure instead of a green no-op.
        run: |
          python3 _ci/scripts/discover_projects.py --family node --format summary
          python3 _ci/scripts/discover_projects.py --family node --list --fail-empty \
            > "$RUNNER_TEMP/node-projects.txt"
      - name: Install pnpm
        if: hashFiles('**/pnpm-lock.yaml') != ''
        # pnpm is a build tool, not project code; version comes from the
        # consumer's lockfile compatibility, so this stays unversioned here.
        run: npm install --global pnpm # zizmor: ignore[adhoc-packages]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ (hashFiles('**/pnpm-lock.yaml') != '' && 'pnpm') || (hashFiles('**/yarn.lock') != '' && 'yarn') || (hashFiles('**/package-lock.json') != '' && 'npm') || '' }}
      - name: Install dependencies
        run: |
          install_one() {
            cd "$1"
            # A lockfile is a contract: when one exists, install reproducibly
            # and treat failures as real failures - never fall back behind a
            # silent || to mutable dependency resolution.
            if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then yarn install --immutable
            elif [ -f package-lock.json ]; then npm ci
            else npm install
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Installing dependencies in $dir"
            install_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Default biome policy (if absent)
        # Biome 2.x formats YAML and Markdown by default, which drags
        # consumer workflow files and prose into the Node stack's gate -
        # YAML hygiene belongs to the hygiene job (yamllint), prose to the
        # docs job. Ship an explicit code-file scope, aligned with the
        # default .editorconfig (spaces, width 2). Commit your own
        # biome.jsonc to take full control.
        run: |
          [ -f biome.jsonc ] || cp _ci/configs/biome.jsonc .
      - name: Lint (project script or biome)
        run: |
          # Helpers resolve absolutely: the loop cds into every discovered
          # project, and a workspace member is deeper than the _ci checkout.
          TOOL_VERSIONS="$GITHUB_WORKSPACE/_ci/scripts/tool_versions.py"
          lint_one() {
            cd "$1"
            if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.lint ? 0 : 1)"; then
              npm run lint --silent
            else
              npx --yes "$(python3 "$TOOL_VERSIONS" npm @biomejs/biome)" ci --no-errors-on-unmatched .
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Linting $dir"
            lint_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Type-check (tsc)
        run: |
          found=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/tsconfig.json" ] || continue
            found=1
            cd "$dir"
            if [ -x node_modules/.bin/tsc ]; then
              node_modules/.bin/tsc --noEmit
            else
              npx --yes -p typescript tsc --noEmit
            fi
            cd "$GITHUB_WORKSPACE"
          done < "$RUNNER_TEMP/node-projects.txt"
          [ "$found" = 1 ] || echo "No tsconfig.json in any project - skipping tsc"
      - name: Flag unused dependencies (depcheck, advisory)
        run: |
          TOOL_VERSIONS="$GITHUB_WORKSPACE/_ci/scripts/tool_versions.py"
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Depchecking $dir"
            (cd "$dir" && npx --yes "$(python3 "$TOOL_VERSIONS" npm depcheck)" --ignores "@types/*,eslint*,prettier,biome*") \
              || echo "::warning::depcheck flagged unused or missing dependencies in $dir (advisory)"
          done < "$RUNNER_TEMP/node-projects.txt"

  # ---------------------------------------------------------------------------
  # Node / TypeScript stack: tests
  # ---------------------------------------------------------------------------
  node-test:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',node-test,'))
      && needs.meta.result == 'success'
      && ((inputs.run_node == 'auto' && needs.changes.outputs.node == 'true') || inputs.run_node == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    env:
      COVERAGE_MIN: ${{ needs.meta.outputs.coverage_min }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Node projects
        run: |
          python3 _ci/scripts/discover_projects.py --family node --format summary
          python3 _ci/scripts/discover_projects.py --family node --list --fail-empty \
            > "$RUNNER_TEMP/node-projects.txt"
      - name: Install pnpm
        if: hashFiles('**/pnpm-lock.yaml') != ''
        # pnpm is a build tool, not project code; version comes from the
        # consumer's lockfile compatibility, so this stays unversioned here.
        run: npm install --global pnpm # zizmor: ignore[adhoc-packages]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ (hashFiles('**/pnpm-lock.yaml') != '' && 'pnpm') || (hashFiles('**/yarn.lock') != '' && 'yarn') || (hashFiles('**/package-lock.json') != '' && 'npm') || '' }}
      - name: Install dependencies
        run: |
          install_one() {
            cd "$1"
            # A lockfile is a contract: when one exists, install reproducibly
            # and treat failures as real failures - never fall back behind a
            # silent || to mutable dependency resolution.
            if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then yarn install --immutable
            elif [ -f package-lock.json ]; then npm ci
            else npm install
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Installing dependencies in $dir"
            install_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Run tests
        run: |
          test_one() {
            cd "$1"
            if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
              if [ -f pnpm-lock.yaml ]; then pnpm test
              elif [ -f yarn.lock ]; then yarn test
              else npm test --silent
              fi
            else
              echo "No test script defined in $1 - skipping"
            fi
            # COVERAGE_MIN > 0 opts into measured test assurance via the
            # project's own test:coverage script (c8/jest --coverage with a
            # cobertura reporter). A project without one contributes no
            # report; the ai-integrity gate is fail-closed on absence.
            if [ -n "$COVERAGE_MIN" ] && [ "$COVERAGE_MIN" != "0" ]; then
              if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts['test:coverage'] ? 0 : 1)"; then
                if [ -f pnpm-lock.yaml ]; then pnpm run test:coverage
                elif [ -f yarn.lock ]; then yarn run test:coverage
                else npm run test:coverage --silent
                fi
              else
                echo "No test:coverage script in $1 - no coverage report from this project"
              fi
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Testing $dir"
            test_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Upload coverage reports
        # Cobertura XML only: other dialects (clover, istanbul JSON) do not
        # parse as cobertura and would fail the gate as corrupt instead.
        if: env.COVERAGE_MIN != '0' && env.COVERAGE_MIN != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-node
          path: "**/coverage/cobertura*.xml"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Python stack: lint, format, types, dead code, complexity, tests
  # ---------------------------------------------------------------------------
  python:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',python,'))
      && needs.meta.result == 'success'
      && ((inputs.run_python == 'auto' && needs.changes.outputs.python == 'true') || inputs.run_python == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    env:
      CX_MAX: ${{ inputs.complexity_max }}
      CX_ENFORCE: ${{ needs.meta.outputs.enforce_complexity }}
      COVERAGE_MIN: ${{ needs.meta.outputs.coverage_min }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: ${{ (hashFiles('**/requirements*.txt') != '' || hashFiles('**/pyproject.toml') != '') && 'pip' || '' }}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Exact pins from configs/tool-versions.yml: a new analyzer
          # release must never change CI behavior silently. Bump pins by
          # PR after validating the template's own gates. NOTE: the
          # substitution is intentionally UNQUOTED so the pin list word-
          # splits into one argument per tool.
          # the pin list is meant to word-split:
          # shellcheck disable=SC2046
          python -m pip install --quiet \
            $(python3 _ci/scripts/tool_versions.py pip ruff mypy vulture lizard pytest tree-sitter tree-sitter-language-pack)
      - name: Ruff lint
        run: |
          { [ -f ruff.toml ] || [ -f .ruff.toml ]; } || \
            { grep -q 'tool.ruff' pyproject.toml 2>/dev/null; } || \
            cp _ci/configs/ruff.toml .
          ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: |
          pyfile=$(git ls-files '*.py' | grep -v '^_ci/' | head -n1)
          if [ -z "$pyfile" ]; then
            echo "No python files - skipping mypy"
            exit 0
          fi
          mypy --ignore-missing-imports .
      - name: Vulture dead-code scan (advisory)
        run: |
          vulture . --min-confidence 80 --exclude '_ci,build,dist,vendor' \
            || echo "::warning::vulture flagged possibly dead code (advisory)"
      - name: Lizard complexity gate
        run: |
          # The parser guarantee (v2.5): this gate is parse-backed, so a
          # missing analyzer is a configuration error (exit 2), never a
          # silent pass.
          command -v lizard >/dev/null 2>&1 || {
            echo "::error::lizard is not importable after the pinned install - the complexity gate cannot run"
            exit 2
          }
          out=$(lizard -l python -C "$CX_MAX" -x '_ci/*' . || true)
          echo "$out"
          if echo "$out" | grep -q '!!!!'; then
            if [ "$CX_ENFORCE" = "true" ]; then
              echo "::error file=::functions exceed cyclomatic complexity $CX_MAX"
              exit 1
            fi
            echo "::warning::functions exceed cyclomatic complexity $CX_MAX (advisory in this profile)"
          fi
      - name: Install project
        run: |
          # Installing the project is part of the test contract: a packaging
          # failure must fail loudly, never leave the tests running against a
          # bare environment that happens to pass.
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e . || pip install .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No installable python project - skipping dependency install"
          fi
      - name: Run pytest
        run: |
          # COVERAGE_MIN > 0 opts the stack into measured test assurance:
          # the suite runs under coverage.py and the report is uploaded for
          # the ai-integrity coverage gate (fail-closed when absent).
          COV_RUNNER=""
          if [ -n "$COVERAGE_MIN" ] && [ "$COVERAGE_MIN" != "0" ]; then
            python -m pip install --quiet coverage
            COV_RUNNER="python -m coverage run -m"
          fi
          run_pytest() {
            if [ -n "$COV_RUNNER" ]; then
              $COV_RUNNER pytest -q
              python -m coverage json -o coverage.json
            else
              python -m pytest -q
            fi
          }
          if [ -d tests ]; then
            # test suites that parse workflow YAML need PyYAML; it ships with
            # many toolchains but is not a pytest dependency - install on miss
            python -c "import yaml" 2>/dev/null || python -m pip install --quiet pyyaml
            run_pytest
          elif find . -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) \
            -not -path './_ci/*' -not -path './node_modules/*' | grep -q .; then
            run_pytest
          else
            echo "No tests found - skipping pytest"
          fi
      - name: Upload coverage report
        if: env.COVERAGE_MIN != '0' && env.COVERAGE_MIN != '' && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python
          path: coverage.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Rust stack: format, clippy, advisories, licenses, tests (shared cache)
  # ---------------------------------------------------------------------------
  rust:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',rust,'))
      && needs.meta.result == 'success'
      && ((inputs.run_rust == 'auto' && needs.changes.outputs.rust == 'true') || inputs.run_rust == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Rust projects
        id: detect
        # Every discovered Cargo root - the repo root, [workspace]
        # members, and nested independent crates - is analyzed
        # explicitly, so the old root-manifest-only warning is
        # obsolete - nothing is left alone anymore. Zero projects means
        # a config-only trigger (deny.toml, rust-toolchain*): skip with
        # the reason, never a green lie about analyzed code.
        run: |
          python3 _ci/scripts/discover_projects.py --family rust --format summary
          python3 _ci/scripts/discover_projects.py --family rust --list \
            > "$RUNNER_TEMP/rust-projects.txt"
          if [ -s "$RUNNER_TEMP/rust-projects.txt" ]; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml discovered - config-only trigger, skipping the Rust stack"
          fi
      - name: Default cargo-deny policy (if absent)
        # cargo-deny's built-in default has an EMPTY license allow list -
        # even MIT gets rejected. Ship the template's baseline policy to
        # every project without its own; commit your own deny.toml per
        # project to take full control.
        if: steps.detect.outputs.manifest == 'true'
        run: |
          while IFS= read -r dir; do
            [ -f "$dir/deny.toml" ] || cp _ci/configs/deny.toml "$dir/deny.toml"
          done < "$RUNNER_TEMP/rust-projects.txt"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch pin; no version tags published) # zizmor: ignore[ref-version-mismatch]
        if: steps.detect.outputs.manifest == 'true'
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.detect.outputs.manifest == 'true'
      - name: Check formatting (rustfmt)
        if: steps.detect.outputs.manifest == 'true'
        run: |
          fmt_fail=0
          while IFS= read -r dir; do
            echo "rustfmt: $dir"
            (cd "$dir" && cargo fmt --all -- --check) || fmt_fail=1
          done < "$RUNNER_TEMP/rust-projects.txt"
          exit "$fmt_fail"
      - name: Lint (clippy)
        if: steps.detect.outputs.manifest == 'true'
        run: |
          clippy_fail=0
          while IFS= read -r dir; do
            echo "clippy: $dir"
            (cd "$dir" && cargo clippy --all-targets -- -D warnings) || clippy_fail=1
          done < "$RUNNER_TEMP/rust-projects.txt"
          exit "$clippy_fail"
      - name: Advisories, licenses, sources (cargo-deny, per project)
        if: steps.detect.outputs.manifest == 'true'
        run: |
          # The action runner cannot loop over discovered projects, so
          # the pinned binary runs once per project: nested crates get
          # the same advisory/license gate the root always had. Pinned
          # --locked source install - the same trust class as the
          # pip/npm pins in configs/tool-versions.yml.
          cargo install --locked --quiet cargo-deny \
            --version "$(python3 _ci/scripts/tool_versions.py cargo cargo-deny)"
          deny_fail=0
          while IFS= read -r dir; do
            echo "cargo-deny: $dir"
            (cd "$dir" && cargo deny check advisories licenses sources) || deny_fail=1
          done < "$RUNNER_TEMP/rust-projects.txt"
          exit "$deny_fail"
      - name: Test
        if: steps.detect.outputs.manifest == 'true'
        run: |
          test_fail=0
          while IFS= read -r dir; do
            echo "cargo test: $dir"
            (cd "$dir" && cargo test --workspace --all-features) || test_fail=1
          done < "$RUNNER_TEMP/rust-projects.txt"
          exit "$test_fail"

  # ---------------------------------------------------------------------------
  # Go stack: formatting, vet, golangci-lint (workspace-aware, per module)
  # ---------------------------------------------------------------------------
  go-lint:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',go-lint,'))
      && needs.meta.result == 'success'
      && ((inputs.run_go == 'auto' && needs.changes.outputs.go == 'true') || inputs.run_go == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch master-ci helpers
        # Helper checkout moves ahead of discovery: workspace-aware Go
        # analysis needs the template's project inventory script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Go modules
        id: detect
        # go.work members and nested go.mod modules are analyzed
        # explicitly, so the old root-manifest-only warning is
        # obsolete - nothing is skipped anymore. Zero modules means a
        # config-only trigger (the go path filter also matches stray or
        # vendored .go files): skip with the reason, not a green lie.
        run: |
          python3 _ci/scripts/discover_projects.py --family go --format summary
          python3 _ci/scripts/discover_projects.py --family go --list \
            > "$RUNNER_TEMP/go-projects.txt"
          if [ -s "$RUNNER_TEMP/go-projects.txt" ]; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod discovered - config-only trigger, skipping the Go stack"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.manifest == 'true'
        with:
          go-version: ${{ inputs.go_version }}
      - name: Check formatting (gofmt)
        if: steps.detect.outputs.manifest == 'true'
        run: |
          fmt_fail=0
          while IFS= read -r dir; do
            unformatted=$(find "$dir" -name '*.go' -type f \
              -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 \
              | xargs -0 gofmt -l)
            if [ -n "$unformatted" ]; then
              echo "::error::Files not gofmt-formatted in $dir:"
              printf '%s\n' "$unformatted"
              fmt_fail=1
            fi
          done < "$RUNNER_TEMP/go-projects.txt"
          exit "$fmt_fail"
      - name: Vet standard library checks
        if: steps.detect.outputs.manifest == 'true'
        run: |
          vet_fail=0
          while IFS= read -r dir; do
            echo "go vet: $dir"
            (cd "$dir" && go vet ./...) || vet_fail=1
          done < "$RUNNER_TEMP/go-projects.txt"
          exit "$vet_fail"
      - name: Lint (golangci-lint, per module)
        if: steps.detect.outputs.manifest == 'true'
        run: |
          # golangci-lint analyzes one module per invocation, so the
          # pinned binary runs once per discovered module: nested
          # modules get the identical gate the root always had, and
          # each module's own .golangci.yml is honored.
          golangci_ref="$(python3 _ci/scripts/tool_versions.py go golangci-lint)"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${golangci_ref}"
          lint_fail=0
          while IFS= read -r dir; do
            echo "golangci-lint: $dir"
            (cd "$dir" && golangci-lint run --timeout=10m) || lint_fail=1
          done < "$RUNNER_TEMP/go-projects.txt"
          exit "$lint_fail"

  # ---------------------------------------------------------------------------
  # Go stack: build + race-tested tests
  # ---------------------------------------------------------------------------
  go-test:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',go-test,'))
      && needs.meta.result == 'success'
      && ((inputs.run_go == 'auto' && needs.changes.outputs.go == 'true') || inputs.run_go == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch master-ci helpers
        # Helper checkout moves ahead of discovery: workspace-aware Go
        # analysis needs the template's project inventory script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Go modules
        id: detect
        # Same contract as go-lint: every go.work member and nested
        # module is built and tested explicitly. Zero modules = a
        # config-only trigger - skip with the reason.
        run: |
          python3 _ci/scripts/discover_projects.py --family go --format summary
          python3 _ci/scripts/discover_projects.py --family go --list \
            > "$RUNNER_TEMP/go-projects.txt"
          if [ -s "$RUNNER_TEMP/go-projects.txt" ]; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod discovered - config-only trigger, skipping Go build and tests"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.manifest == 'true'
        with:
          go-version: ${{ inputs.go_version }}
      - name: Build
        if: steps.detect.outputs.manifest == 'true'
        run: |
          build_fail=0
          while IFS= read -r dir; do
            echo "go build: $dir"
            (cd "$dir" && go build ./...) || build_fail=1
          done < "$RUNNER_TEMP/go-projects.txt"
          exit "$build_fail"
      - name: Test (race detector, shuffled)
        if: steps.detect.outputs.manifest == 'true'
        env:
          COVERAGE_MIN: ${{ needs.meta.outputs.coverage_min }}
        run: |
          # COVERAGE_MIN > 0 opts into measured test assurance: the same
          # race+shuffle run emits a native coverprofile per discovered
          # module (covdir/<module>/cover.out), consumed by the
          # ai-integrity coverage gate's recursive report discovery.
          test_fail=0
          while IFS= read -r dir; do
            echo "go test: $dir"
            if [ -n "$COVERAGE_MIN" ] && [ "$COVERAGE_MIN" != "0" ]; then
              safe="covdir/$(printf '%s' "$dir" | tr '/' '_')"
              mkdir -p "$safe"
              (cd "$dir" && go test -race -shuffle=on \
                -coverprofile="$GITHUB_WORKSPACE/$safe/cover.out" ./...) || test_fail=1
              go tool cover -func="$GITHUB_WORKSPACE/$safe/cover.out" >/dev/null || test_fail=1
            else
              (cd "$dir" && go test -race -shuffle=on ./...) || test_fail=1
            fi
          done < "$RUNNER_TEMP/go-projects.txt"
          exit "$test_fail"
      - name: Upload coverage reports
        if: steps.detect.outputs.manifest == 'true' && needs.meta.outputs.coverage_min != '0' && needs.meta.outputs.coverage_min != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-go
          path: covdir
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JVM stack (Java, Kotlin, Scala riding Maven or Gradle): wrapper validation,
  # build + verify. Lint and tests ride the build tool's own lifecycle, which
  # is the idiom Maven and Gradle projects already maintain.
  # ---------------------------------------------------------------------------
  java:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',java,'))
      && needs.meta.result == 'success'
      && ((inputs.run_java == 'auto' && needs.changes.outputs.java == 'true') || inputs.run_java == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch master-ci helpers
        # Helper checkout moves ahead of discovery: workspace-aware JVM
        # analysis needs the template's project inventory script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover JVM projects
        id: detect
        # Nested poms and Gradle builds are analyzed explicitly, so the
        # old root-builds-only warning is obsolete. Zero projects =
        # config-only trigger - skip with the reason.
        run: |
          python3 _ci/scripts/discover_projects.py --family jvm --format summary
          python3 _ci/scripts/discover_projects.py --family jvm --list \
            > "$RUNNER_TEMP/jvm-projects.txt"
          if [ -s "$RUNNER_TEMP/jvm-projects.txt" ]; then
            echo "tool=present" >> "$GITHUB_OUTPUT"
          else
            echo "tool=none" >> "$GITHUB_OUTPUT"
            echo "No pom.xml or Gradle build discovered - config-only trigger, skipping the JVM stack"
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.detect.outputs.tool != 'none'
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ (hashFiles('**/pom.xml') != '' && 'maven') || (hashFiles('**/build.gradle*') != '' && 'gradle') || '' }}
      - name: Validate Gradle wrapper checksums
        # a wrapper jar that does not match the recorded SHA of its
        # distribution is a supply-chain incident, not a build problem
        if: steps.detect.outputs.tool != 'none' && hashFiles('**/gradle/wrapper/gradle-wrapper.properties') != ''
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and verify (per project)
        # Each discovered project rides its own build tool's declared
        # lifecycle: Maven `verify` / Gradle `build` compiles, tests and
        # packages the way the project itself declares. One red project
        # fails the stack - accumulation, never first-failure abort.
        if: steps.detect.outputs.tool != 'none'
        run: |
          build_fail=0
          while IFS= read -r dir; do
            if [ -f "$dir/pom.xml" ] || [ -f "$dir/mvnw" ]; then
              echo "Maven verify: $dir"
              if [ -x "$dir/mvnw" ]; then
                (cd "$dir" && ./mvnw -B -ntp verify) || build_fail=1
              else
                (cd "$dir" && mvn -B -ntp verify) || build_fail=1
              fi
            else
              echo "Gradle build: $dir"
              if [ -x "$dir/gradlew" ]; then
                (cd "$dir" && ./gradlew --no-daemon build) || build_fail=1
              else
                (cd "$dir" && gradle --no-daemon build) || build_fail=1
              fi
            fi
          done < "$RUNNER_TEMP/jvm-projects.txt"
          exit "$build_fail"

  # ---------------------------------------------------------------------------
  # C/C++ stack: cppcheck static analysis (advisory), opt-in clang-format
  # gate, then build + ctest through the project's own build system.
  # ---------------------------------------------------------------------------
  cpp:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',cpp,'))
      && needs.meta.result == 'success'
      && ((inputs.run_cpp == 'auto' && needs.changes.outputs.cpp == 'true') || inputs.run_cpp == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect C/C++ build system
        id: detect
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "build=cmake" >> "$GITHUB_OUTPUT"
          elif [ -f Makefile ]; then
            echo "build=make" >> "$GITHUB_OUTPUT"
          else
            echo "build=none" >> "$GITHUB_OUTPUT"
            echo "No CMakeLists.txt or Makefile at repository root - sources are lint-only"
          fi
      - name: Static analysis (cppcheck, advisory)
        run: |
          command -v cppcheck >/dev/null 2>&1 || sudo apt-get install -y -qq cppcheck
          rc=0
          cppcheck --enable=warning,style,performance --inline-suppr \
            --suppress=missingIncludeSystem --std=c++17 -q . || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::cppcheck flagged issues (advisory in every profile)"
          fi
      - name: Check formatting (clang-format, only when the repo opts in)
        # formatting is enforced only where a .clang-format exists: its
        # presence is the project's consent to be formatted at all
        if: hashFiles('.clang-format') != ''
        run: |
          command -v clang-format >/dev/null 2>&1 || sudo apt-get install -y -qq clang-format
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          [ -z "$files" ] && exit 0
          printf '%s\n' "$files" | xargs -n1 clang-format --dry-run -Werror
      - name: Build and test (CMake)
        if: steps.detect.outputs.build == 'cmake'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "No CTest suite registered - skipping ctest"
          fi
      - name: Build (Make)
        if: steps.detect.outputs.build == 'make'
        run: make -j2

  # ---------------------------------------------------------------------------
  # .NET stack (C#, F#): setup-dotnet (global.json wins over the input),
  # release build with implicit restore, tests, advisory format drift.
  # ---------------------------------------------------------------------------
  csharp:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',csharp,'))
      && needs.meta.result == 'success'
      && ((inputs.run_csharp == 'auto' && needs.changes.outputs.csharp == 'true') || inputs.run_csharp == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect .NET project
        id: detect
        run: |
          if compgen -G '*.sln' >/dev/null || compgen -G '*.slnx' >/dev/null; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          elif compgen -G '*.csproj' >/dev/null || compgen -G '*.fsproj' >/dev/null; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*/*.csproj' '*/*.fsproj' '*/*.sln' '*/*.slnx' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested .NET project(s) detected but this job analyzes root projects only: $nested"
            fi
            echo "No .sln or .csproj/.fsproj at repository root - .NET stack supports root projects only"
          fi
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        # global.json is the project's own SDK pin and always wins over
        # the dotnet_version input
        if: steps.detect.outputs.project == 'true' && hashFiles('global.json') == ''
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.detect.outputs.project == 'true' && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - name: Build and test
        if: steps.detect.outputs.project == 'true'
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build
      - name: Format drift (dotnet format, advisory)
        # checked only when an .editorconfig exists - adopting the check is
        # a decision the project makes by committing its formatting policy
        if: steps.detect.outputs.project == 'true' && hashFiles('.editorconfig') != ''
        run: |
          rc=0
          dotnet format --verify-no-changes || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::dotnet format found drift (advisory in every profile)"
          fi

  # ---------------------------------------------------------------------------
  # Ruby stack: bundler install with cache, advisory RuboCop and
  # bundler-audit, tests through rake (minitest) or rspec.
  # ---------------------------------------------------------------------------
  ruby:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',ruby,'))
      && needs.meta.result == 'success'
      && ((inputs.run_ruby == 'auto' && needs.changes.outputs.ruby == 'true') || inputs.run_ruby == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Ruby project
        id: detect
        run: |
          if [ -f Gemfile ] || [ -f Rakefile ] || compgen -G '*.gemspec' >/dev/null; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*Gemfile' '*Rakefile' '*.gemspec' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested Ruby project(s) detected but this job analyzes root projects only: $nested"
            fi
            echo "No Gemfile, gemspec or Rakefile at repository root - Ruby stack supports root projects only"
          fi
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: steps.detect.outputs.project == 'true'
        with:
          ruby-version: ${{ inputs.ruby_version }}
          # bundler-cache installs the Gemfile with dependency caching; a
          # gemspec-only project has no Gemfile and must not fail setup
          bundler-cache: ${{ hashFiles('Gemfile') != '' }}
      - name: Lint (RuboCop, advisory)
        if: steps.detect.outputs.project == 'true'
        run: |
          if bundle exec rubocop --version >/dev/null 2>&1; then
            rc=0
            bundle exec rubocop || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::RuboCop flagged offenses (advisory in every profile)"
            fi
          else
            echo "RuboCop is not in the bundle - skipping"
          fi
      - name: Dependency advisories (bundler-audit, advisory)
        if: steps.detect.outputs.project == 'true'
        # the audit gem below is a scanner, not a project dependency; its
        # version is deliberately not locked (advisory step)
        run: | # zizmor: ignore[adhoc-packages]
          if [ -f Gemfile.lock ]; then
            gem install bundler-audit --no-document >/dev/null 2>&1 || true
            rc=0
            bundle-audit check --update || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::bundler-audit flagged vulnerable gems (advisory in every profile)"
            fi
          else
            echo "No Gemfile.lock - skipping bundler-audit"
          fi
      - name: Test suite
        if: steps.detect.outputs.project == 'true'
        run: |
          if [ -d spec ]; then
            bundle exec rspec
          elif [ -d test ]; then
            bundle exec rake test
          else
            echo "No spec/ or test/ directory - skipping Ruby tests"
          fi

  # ---------------------------------------------------------------------------
  # PHP stack: composer install (lockfile-faithful), syntax check over every
  # tracked file, opt-in PHPStan, tests through the composer script or
  # PHPUnit.
  # ---------------------------------------------------------------------------
  php:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',php,'))
      && needs.meta.result == 'success'
      && ((inputs.run_php == 'auto' && needs.changes.outputs.php == 'true') || inputs.run_php == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect PHP project
        id: detect
        run: |
          if [ -f composer.json ]; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*/composer.json' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested PHP project(s) detected but this job analyzes root projects only: $nested"
            fi
            echo "No composer.json at repository root - PHP stack supports root projects only"
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        if: steps.detect.outputs.project == 'true'
        with:
          php-version: ${{ inputs.php_version }}
          coverage: none
      - name: Install dependencies
        # composer install never rewrites composer.lock: a lock drift is a
        # consumer decision, not something CI resolves silently
        if: steps.detect.outputs.project == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax check (php -l)
        if: steps.detect.outputs.project == 'true'
        run: |
          files=$(git ls-files '*.php' | grep -v '^vendor/' || true)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs -r -n1 php -l
          fi
      - name: Static analysis (PHPStan, only when the repo opts in)
        if: steps.detect.outputs.project == 'true'
        run: |
          config=""
          for candidate in phpstan.neon.dist phpstan.neon phpstan.neon.dist.php; do
            [ -f "$candidate" ] && { config="$candidate"; break; }
          done
          if [ -n "$config" ] && [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "No PHPStan config or dev dependency - skipping"
          fi
      - name: Test suite
        if: steps.detect.outputs.project == 'true'
        run: |
          test_script=$(composer config scripts.test 2>/dev/null || true)
          if [ -n "$test_script" ]; then
            composer test
          elif ls phpunit.xml phpunit.xml.dist >/dev/null 2>&1 && [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No composer test script or PHPUnit config - skipping PHP tests"
          fi

  # ---------------------------------------------------------------------------
  # Docker stack: hadolint lint (advisory), a proof-build per tracked
  # Dockerfile with size reporting, then an image-level Trivy scan whose
  # exit code follows the same enforce_trivy flag as the filesystem scan
  # in the security job (strict enforces).
  # ---------------------------------------------------------------------------
  docker:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',docker,'))
      && needs.meta.result == 'success'
      && ((inputs.run_docker == 'auto' && needs.changes.outputs.docker == 'true') || inputs.run_docker == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_EXIT: ${{ needs.meta.outputs.enforce_trivy == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover Dockerfiles
        id: files
        run: |
          files=$(git ls-files '*Dockerfile*' '*.dockerfile' | grep -v '^_ci/' || true)
          if [ -z "$files" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No Dockerfiles tracked - skipping"
            exit 0
          fi
          printf '%s\n' "$files" > dockerfiles.txt
          count=$(printf '%s\n' "$files" | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count Dockerfile(s):"
          printf '%s\n' "$files"
      - name: Lint Dockerfiles (hadolint, advisory)
        if: steps.files.outputs.count != '0'
        # checksum recorded from the v2.12.0 release asset at adoption time
        run: |
          DL_OK=0
          for _attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 4 --retry-delay 4 --retry-all-errors -o /tmp/hadolint \
              https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-linux-x86_64; then DL_OK=1; break; fi
            echo "download attempt $_attempt failed; backing off 45s"
            sleep 45
          done
          [ "$DL_OK" = "1" ] || { echo '::error::hadolint download failed after 6 attempts'; exit 1; }
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          rc=0
          # each Dockerfile path is one argv entry:
          # shellcheck disable=SC2046
          /tmp/hadolint --no-color $(tr '\n' ' ' < dockerfiles.txt) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::hadolint flagged Dockerfile issues (advisory in every profile; commit .hadolint.yaml to tune)"
          fi
      - name: Build every Dockerfile (no push)
        # One proof-build per tracked Dockerfile - not just the first:
        # a repo with a root image plus service images used to prove only
        # the root one compiles, and breakage elsewhere stayed green.
        # The first tracked Dockerfile keeps the plain sha tag so the
        # Trivy image scan below stays stable; every image gets a
        # per-file tag and a size notice. Multi-arch publishing lives in
        # release-docker.yml.
        if: steps.files.outputs.count != '0'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          first=1
          built=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            safe=$(printf '%s' "$file" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')
            echo "Building $file"
            context=$(dirname "$file")
            if [ "$first" = 1 ]; then
              docker build --file "$file" --tag "master-ci-ci:$IMAGE_TAG" \
                --tag "master-ci-ci:$safe-$IMAGE_TAG" "$context"
              first=0
            else
              docker build --file "$file" --tag "master-ci-ci:$safe-$IMAGE_TAG" "$context"
            fi
            size=$(docker image inspect "master-ci-ci:$safe-$IMAGE_TAG" --format '{{.Size}}')
            echo "::notice::image $file built - $(numfmt --to=iec "$size" 2>/dev/null || echo "${size}B")"
            built=$((built + 1))
          done < dockerfiles.txt
          echo "Built $built image(s)"
      - name: Scan the built image (Trivy)
        if: steps.files.outputs.count != '0'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: master-ci-ci:${{ github.sha }}
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: ${{ env.TRIVY_EXIT }}
          ignore-unfixed: true
      - name: Upload image-scan SARIF
        if: always() && hashFiles('trivy-image.sarif') != '' && steps.files.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ---------------------------------------------------------------------------
  # Security: semgrep + trivy + osv-scanner, results pushed to the Security tab
  # ---------------------------------------------------------------------------
  security:
    needs: [meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',security,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_PACKS: ${{ needs.meta.outputs.semgrep_packs }}
      TRIVY_EXIT: ${{ needs.meta.outputs.enforce_trivy == 'true' && '1' || '0' }}
      OSV_ENFORCE: ${{ needs.meta.outputs.enforce_osv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Copy default semgrepignore
        run: '[ -f .semgrepignore ] || cp _ci/configs/.semgrepignore .'
      - name: Semgrep static analysis
        run: |
          pip install --quiet "$(python3 _ci/scripts/tool_versions.py pip semgrep)"
          read -ra packs <<< "$SEMGREP_PACKS"
          args=()
          for c in "${packs[@]}"; do
            args+=(--config "$c")
          done
          semgrep scan "${args[@]}" --sarif --output semgrep.sarif \
            --metrics=off --quiet .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: ${{ env.TRIVY_EXIT }}
          ignore-unfixed: true
      - name: OSV vulnerability scan
        run: |
          DL_OK=0
          for _attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 4 --retry-delay 4 --retry-all-errors -o osv-scanner \
              https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64; then DL_OK=1; break; fi
            echo "download attempt $_attempt failed; backing off 45s"
            sleep 45
          done
          [ "$DL_OK" = "1" ] || { echo '::error::osv-scanner download failed after 6 attempts'; exit 1; }
          chmod +x osv-scanner
          rc=0
          ./osv-scanner scan source -r . --format sarif --output-file osv.sarif || rc=$?
          if [ ! -s osv.sarif ]; then
            echo "No package manifests found - skipping OSV gate"
            exit 0
          fi
          if [ "$rc" -ne 0 ] && [ "$OSV_ENFORCE" != "true" ]; then
            echo "::warning::OSV found vulnerable dependencies (advisory in this profile)"
            exit 0
          fi
          exit "$rc"
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Upload OSV SARIF
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # ---------------------------------------------------------------------------
  # Dependency review on pull requests (vulns + license changes).
  # Requires the repository dependency graph; when it is disabled this
  # degrades to an explicit advisory instead of a red infrastructure failure.
  # ---------------------------------------------------------------------------
  deps-review:
    needs: [meta]
    if: github.event_name == 'pull_request' && (inputs.select == '' || contains(format(',{0},', inputs.select), ',deps-review,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEPS_SEVERITY: ${{ needs.meta.outputs.deps_fail_severity }}
    steps:
      - name: Probe dependency graph support
        id: dg
        env:
          # Without this mapping the probe would run unauthenticated, get
          # HTTP 401 on private repos, and dependency review would silently
          # never run at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "dependency-graph compare returned HTTP $code"
      - name: Dependency review
        if: steps.dg.outputs.http == '200'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ env.DEPS_SEVERITY }}
          comment-summary-in-pr: true
      - name: Dependency review unavailable
        if: steps.dg.outputs.http != '200'
        run: |
          echo "::warning::Dependency graph is disabled for this repository - \
          dependency review was skipped (advisory). Enable it under \
          Settings > General > Security > Dependency graph to enforce it."

  # ---------------------------------------------------------------------------
  # OSSF Scorecard on pushes to the default branch. Publishing results
  # (badge/API data) needs id-token: write on this job only.
  # ---------------------------------------------------------------------------
  scorecard:
    # scorecard_publish: false skips the job entirely - callers who opt out
    # then never need the id-token: write grant, as the README promises.
    # Without this gate the job would still run (and demand OIDC) on every
    # push to the default branch, which startup-fails any caller that took
    # the documented way to drop id-token.
    if: >-
      inputs.scorecard_publish
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (inputs.select == '' || contains(format(',{0},', inputs.select), ',scorecard,'))
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ inputs.scorecard_publish }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # ---------------------------------------------------------------------------
  # Dashboard comment on pull requests
  # ---------------------------------------------------------------------------
  dashboard:
    needs:
      [
        changes, meta, hygiene, secrets, ai-integrity, docs, node-lint,
        node-test, python, rust, go-lint, go-test, java, cpp, csharp, ruby,
        php, docker, security, deps-review, scorecard, coverage-gate,
        new-code-gate, quality-ratchet,
      ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      NEEDS_JSON: ${{ toJson(needs.*.result) }}
      COVERAGE_MIN: ${{ needs.meta.outputs.coverage_min }}
      NEW_CODE_GATES: ${{ needs.meta.outputs.new_code_gates }}
      RATCHET: ${{ needs.meta.outputs.ratchet }}
      RATCHET_FILE: ${{ needs.meta.outputs.ratchet_file }}
    steps:
      - name: Build dashboard
        run: |
          python3 - >> dashboard.md <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          labels = [
              ("changes", "Change detection"),
              ("meta", "Helper resolution"),
              ("hygiene", "Repo hygiene"),
              ("secrets", "Secrets"),
              ("ai-integrity", "AI integrity"),
              ("docs", "Docs"),
              ("node-lint", "Node lint"),
              ("node-test", "Node tests"),
              ("python", "Python"),
              ("rust", "Rust"),
              ("go-lint", "Go lint"),
              ("go-test", "Go tests"),
              ("java", "JVM (Java/Kotlin)"),
              ("cpp", "C/C++"),
              ("csharp", ".NET (C#/F#)"),
              ("ruby", "Ruby"),
              ("php", "PHP"),
              ("docker", "Docker"),
              ("security", "Security"),
              ("deps-review", "Dependency review"),
              ("scorecard", "Scorecard"),
              ("coverage-gate", "Coverage gate"),
              ("new-code-gate", "New-code gate"),
              ("quality-ratchet", "Quality ratchet"),
          ]
          icon = {
              "success": "white_check_mark",
              "failure": "x",
              "cancelled": "no_entry_sign",
              "skipped": "fast_forward",
          }
          print("| Check | Result |")
          print("|---|---|")
          for (name, label), result in zip(labels, results):
              state = icon.get(result, "question")
              print(f"| {label} (`{name}`) | :{state}: `{result}` |")
          print()
          print("### Test assurance")
          print()
          print("| Layer | State |")
          print("|---|---|")
          cov = os.environ.get("COVERAGE_MIN", "").strip()
          if cov not in ("", "0"):
              print(f"| Coverage floor | armed at {cov}% |")
          else:
              print("| Coverage floor | off - set `coverage_min` > 0 |")
          if os.environ.get("NEW_CODE_GATES", "") == "true":
              print("| New-code ceilings | armed on the merge-base diff |")
          else:
              print("| New-code ceilings | off - set `new_code_gates: true` and `diff_base` |")
          ratchet = os.environ.get("RATCHET", "false")
          ratchet_file = os.environ.get("RATCHET_FILE", ".quality-baseline.json")
          if ratchet == "true":
              print(f"| Quality ratchet | armed - `{ratchet_file}` is the floor |")
          elif ratchet == "auto":
              print(f"| Quality ratchet | opted-in when `{ratchet_file}` is committed |")
          else:
              print(f"| Quality ratchet | off - commit `{ratchet_file}` or set `ratchet: true` |")
          print("| Mutation testing | scheduled workflow (`mutation.yml`) - opt-in, Python and Node |")
          print("| Flake hunt | scheduled workflow (`flaky.yml`) - arms when `.flaky-baseline.json` is committed |")
          print()
          print("Findings: Security tab, inline annotations, step summaries.")
          PY
      - name: Post dashboard comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- master-ci-dashboard -->\n' +
              fs.readFileSync('dashboard.md', 'utf8');
            const opts = { owner: context.repo.owner, repo: context.repo.repo };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...opts,
              issue_number: context.issue.number,
            });
            const mine = comments.find(
              (c) =>
                c.user &&
                c.user.login === 'github-actions[bot]' &&
                c.body &&
                c.body.includes('<!-- master-ci-dashboard -->'),
            );
            if (mine) {
              await github.rest.issues.updateComment({ ...opts, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...opts,
                issue_number: context.issue.number,
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # Single required check: fails when any non-skipped job failed
  # ---------------------------------------------------------------------------
  ci-success:
    needs:
      [
        changes, meta, hygiene, secrets, ai-integrity, docs, node-lint,
        node-test, python, rust, go-lint, go-test, java, cpp, csharp, ruby,
        php, docker, security, deps-review, scorecard, coverage-gate,
        new-code-gate, quality-ratchet,
      ]
    if: always()
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
    env:
      NEEDS_JSON: ${{ toJson(needs.*.result) }}
      COVERAGE_MIN: ${{ needs.meta.outputs.coverage_min }}
      NEW_CODE_GATES: ${{ needs.meta.outputs.new_code_gates }}
      RATCHET: ${{ needs.meta.outputs.ratchet }}
      RATCHET_FILE: ${{ needs.meta.outputs.ratchet_file }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Aggregate results
        id: aggregate
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          names = [
              "changes",
              "meta",
              "hygiene",
              "secrets",
              "ai-integrity",
              "docs",
              "node-lint",
              "node-test",
              "python",
              "rust",
              "go-lint",
              "go-test",
              "java",
              "cpp",
              "csharp",
              "ruby",
              "php",
              "docker",
              "security",
              "deps-review",
              "scorecard",
              "coverage-gate",
              "new-code-gate",
              "quality-ratchet",
          ]
          labels = {
              "changes": "Change detection",
              "meta": "Helper resolution",
              "hygiene": "Repo hygiene",
              "secrets": "Secrets",
              "ai-integrity": "AI integrity",
              "docs": "Docs",
              "node-lint": "Node lint",
              "node-test": "Node tests",
              "python": "Python",
              "rust": "Rust",
              "go-lint": "Go lint",
              "go-test": "Go tests",
              "java": "JVM (Java/Kotlin)",
              "cpp": "C/C++",
              "csharp": ".NET (C#/F#)",
              "ruby": "Ruby",
              "php": "PHP",
              "docker": "Docker",
              "security": "Security",
              "deps-review": "Dependency review",
              "scorecard": "Scorecard",
              "coverage-gate": "Coverage gate",
              "new-code-gate": "New-code gate",
              "quality-ratchet": "Quality ratchet",
          }
          icon = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":no_entry_sign:",
              "skipped": ":fast_forward:",
          }
          failed = False
          rows = []
          for name, result in zip(names, results):
              if result in ("failure", "cancelled"):
                  failed = True
              rows.append(f"| {labels[name]} (`{name}`) | {icon.get(result, ':question:')} `{result}` |")
          verdict = "failed" if failed else "passed"
          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as handle:
                  handle.write(f"verdict={verdict}\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Master CI summary\n\n")
                  handle.write(f"**Result: {verdict}** - [view run]({os.environ['RUN_URL']})\n\n")
                  handle.write("| Check | Result |\n")
                  handle.write("|---|---|\n")
                  handle.write("\n".join(rows) + "\n\n")
                  cov = os.environ.get("COVERAGE_MIN", "").strip()
                  gates = os.environ.get("NEW_CODE_GATES", "")
                  ratchet = os.environ.get("RATCHET", "false")
                  ratchet_file = os.environ.get("RATCHET_FILE", ".quality-baseline.json")
                  assurance = [
                      (
                          "Coverage floor",
                          f"armed at {cov}%"
                          if cov not in ("", "0")
                          else "off - set `coverage_min` > 0",
                      ),
                      (
                          "New-code ceilings",
                          "armed on the merge-base diff"
                          if gates == "true"
                          else "off - set `new_code_gates: true` and `diff_base`",
                      ),
                      (
                          "Quality ratchet",
                          f"armed - `{ratchet_file}` is the floor"
                          if ratchet == "true"
                          else (
                              f"opted-in when `{ratchet_file}` is committed"
                              if ratchet == "auto"
                              else f"off - commit `{ratchet_file}` or set `ratchet: true`"
                          ),
                      ),
                      (
                          "Mutation testing",
                          "scheduled workflow (`mutation.yml`) - opt-in, Python and Node",
                      ),
                      (
                          "Flake hunt",
                          "scheduled workflow (`flaky.yml`) - arms when `.flaky-baseline.json` is committed",
                      ),
                  ]
                  handle.write("### Test assurance\n\n| Layer | State |\n|---|---|\n")
                  for layer, state in assurance:
                      handle.write(f"| {layer} | {state} |\n")
                  handle.write("\n")
                  handle.write(
                      "Security findings live in the **Security** tab (code scanning) "
                      "and as inline annotations on pull requests.\n"
                  )
          raise SystemExit(1 if failed else 0)
          PY
