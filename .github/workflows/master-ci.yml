# =============================================================================
# Master CI - the one-stop reusable pipeline for ten stacks:
#   Rust, Node/TypeScript, Python, Go, JVM (Java/Kotlin/Scala via Maven or
#   Gradle), C/C++, .NET (C#/F#), Ruby, PHP and Docker
# =============================================================================
# Zero-config by default: every check auto-detects your stack and skips itself
# when nothing relevant changed. All findings land in the Security tab, as
# inline PR annotations and in a dashboard comment on every pull request.
#
# Deployment and release pipelines ship as sibling reusable workflows:
#   release-docker.yml - multi-arch container build + push (GHCR/Docker Hub/ECR)
#   deploy-aws.yml     - OIDC-first deploys to S3, Lambda, ECS, CloudFormation
#
# Called with a single line from any repository:
#   uses: WasewaseX/master-ci/.github/workflows/master-ci.yml@v1
#
# Permissions are least-privilege per job: most jobs only get contents: read.
# Only the jobs that need more declare more (security, deps-review, dashboard,
# scorecard). No secrets beyond the automatic GITHUB_TOKEN are used, so
# callers do NOT need `secrets: inherit`.
# =============================================================================

name: Master CI

on:
  workflow_call:
    inputs:
      profile:
        description: 'quick | standard | strict | custom - preset enforcement table'
        required: false
        type: string
        default: standard
      runs_on:
        description: Runner label for every job (e.g. ubuntu-latest, macos-latest)
        required: false
        type: string
        default: ubuntu-latest
      node_version:
        description: Node.js version for the TypeScript/Node stack
        required: false
        type: string
        default: '22'
      python_version:
        description: Python version for the Python stack
        required: false
        type: string
        default: '3.13'
      rust_toolchain:
        description: Rust toolchain for the Rust stack
        required: false
        type: string
        default: 'stable'
      run_node:
        description: 'auto | true | false - run the Node/TS stack'
        required: false
        type: string
        default: auto
      run_python:
        description: 'auto | true | false - run the Python stack'
        required: false
        type: string
        default: auto
      run_rust:
        description: 'auto | true | false - run the Rust stack'
        required: false
        type: string
        default: auto
      run_go:
        description: 'auto | true | false - run the Go stack'
        required: false
        type: string
        default: auto
      go_version:
        description: Go toolchain for the Go stack
        required: false
        type: string
        default: 'stable'
      run_java:
        description: 'auto | true | false - run the JVM stack (Java, Kotlin, Scala via Maven/Gradle)'
        required: false
        type: string
        default: auto
      java_version:
        description: JDK version for the JVM stack (Temurin)
        required: false
        type: string
        default: '21'
      run_cpp:
        description: 'auto | true | false - run the C/C++ stack'
        required: false
        type: string
        default: auto
      run_csharp:
        description: 'auto | true | false - run the .NET stack (C#/F#)'
        required: false
        type: string
        default: auto
      dotnet_version:
        description: .NET SDK for the .NET stack (ignored when global.json pins one)
        required: false
        type: string
        default: '10.0'
      run_ruby:
        description: 'auto | true | false - run the Ruby stack'
        required: false
        type: string
        default: auto
      ruby_version:
        description: Ruby version for the Ruby stack
        required: false
        type: string
        default: '3.4'
      run_php:
        description: 'auto | true | false - run the PHP stack'
        required: false
        type: string
        default: auto
      php_version:
        description: PHP version for the PHP stack
        required: false
        type: string
        default: '8.4'
      run_docker:
        description: 'auto | true | false - run the Docker stack (hadolint, image build, image scan)'
        required: false
        type: string
        default: auto
      select:
        description: >-
          Comma-separated job names to run (empty = all): hygiene, secrets,
          ai-integrity, docs, node-lint, node-test, python, rust, go-lint,
          go-test, java, cpp, csharp, ruby, php, docker, security,
          deps-review, scorecard. Unknown names fail the run in meta -
          never silently skipped.
        required: false
        type: string
        default: ''
      semgrep_config:
        description: Space-separated Semgrep registry packs (used by standard/strict/custom)
        required: false
        type: string
        default: 'p/default p/security-audit p/secrets'
      fail_on_ai_slop:
        description: 'Fail the build on AI-integrity blocking score (advisory by default)'
        required: false
        type: boolean
        default: false
      ai_slop_max_score:
        description: Blocking score cap tolerated by the AI-integrity detector
        required: false
        type: number
        default: 8
      ai_slop_max_deficit:
        description: 'Project slop-score ceiling (0=clean..100=awful); PRs above it fail when fail_on_ai_slop is set'
        required: false
        type: number
        default: 30
      complexity_max:
        description: Max cyclomatic complexity per function
        required: false
        type: number
        default: 15
      duplication_threshold_pct:
        description: Max allowed duplicated code percentage
        required: false
        type: number
        default: 5
      scorecard_publish:
        description: Run and publish OSSF Scorecard (badge/API). false skips the whole job, so id-token is not needed.
        required: false
        type: boolean
        default: true
      template_repo:
        description: Repo holding master-ci helpers (auto-detected when empty)
        required: false
        type: string
        default: ''
      template_ref:
        description: >-
          Ref of the master-ci repo to fetch helpers from. Empty resolves to
          the exact commit of this workflow file, so helpers always match the
          workflow version. Explicit main/master print a mutable-ref warning.
        required: false
        type: string
        default: ''
      concurrency_key:
        description: Extra key for the concurrency group (set when calling this workflow several times from one workflow)
        required: false
        type: string
        default: ''
    outputs:
      verdict:
        description: Aggregate verdict of the whole pipeline (passed | failed)
        value: ${{ jobs.ci-success.outputs.verdict }}

permissions:
  contents: read

concurrency:
  group: master-ci-${{ github.workflow }}-${{ inputs.concurrency_key }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve which helper repo provides scripts and default configs, then
  # translate the enforcement profile into concrete job settings.
  # ---------------------------------------------------------------------------
  meta:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    outputs:
      template_repo: ${{ steps.repo.outputs.template_repo }}
      template_ref: ${{ steps.repo.outputs.template_ref }}
      semgrep_packs: ${{ steps.profile.outputs.semgrep_packs }}
      enforce_osv: ${{ steps.profile.outputs.enforce_osv }}
      enforce_trivy: ${{ steps.profile.outputs.enforce_trivy }}
      enforce_duplication: ${{ steps.profile.outputs.enforce_duplication }}
      enforce_complexity: ${{ steps.profile.outputs.enforce_complexity }}
      deps_fail_severity: ${{ steps.profile.outputs.deps_fail_severity }}
    steps:
      - name: Validate caller inputs
        env:
          TEMPLATE_REPO_INPUT: ${{ inputs.template_repo }}
          TEMPLATE_REF: ${{ inputs.template_ref }}
          PROFILE: ${{ inputs.profile }}
          RUN_NODE: ${{ inputs.run_node }}
          RUN_PYTHON: ${{ inputs.run_python }}
          RUN_RUST: ${{ inputs.run_rust }}
          RUN_GO: ${{ inputs.run_go }}
          RUN_JAVA: ${{ inputs.run_java }}
          RUN_CPP: ${{ inputs.run_cpp }}
          RUN_CSHARP: ${{ inputs.run_csharp }}
          RUN_RUBY: ${{ inputs.run_ruby }}
          RUN_PHP: ${{ inputs.run_php }}
          RUN_DOCKER: ${{ inputs.run_docker }}
          SELECT: ${{ inputs.select }}
        run: |
          # Untrusted caller input never reaches a checkout ref unvalidated,
          # and a typo must fail the run - never silently skip a stack.
          die() { echo "::error::$1"; exit 1; }
          if [ -n "$TEMPLATE_REPO_INPUT" ] && \
            ! printf '%s' "$TEMPLATE_REPO_INPUT" | grep -Eqx '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'; then
            die "template_repo must look like owner/repo (letters, digits, dot, dash, underscore)"
          fi
          for ref in $(printf '%s' "$TEMPLATE_REF"); do
            [ -z "$ref" ] && continue
            case "$ref" in
              -*|*..*|*[!A-Za-z0-9._/-]*)
                die "template_ref contains unsafe characters or sequences; use a branch, tag or commit SHA" ;;
            esac
          done
          case "$TEMPLATE_REF" in
            main|master)
              echo "::warning::template_ref='$TEMPLATE_REF' fetches helpers from a mutable branch"
              echo "::warning::pin it to a release tag for reproducible CI - empty means the caller's own commit (self/fork only)" ;;
          esac
          case "$PROFILE" in
            quick|standard|strict|custom) ;;
            *) die "profile must be one of: quick, standard, strict, custom" ;;
          esac
          for value in "$RUN_NODE" "$RUN_PYTHON" "$RUN_RUST" "$RUN_GO" \
            "$RUN_JAVA" "$RUN_CPP" "$RUN_CSHARP" "$RUN_RUBY" "$RUN_PHP" "$RUN_DOCKER"; do
            case "$value" in
              auto|true|false) ;;
              *) die "run_* stack toggles must be auto, true or false (got '$value')" ;;
            esac
          done
          case "$SELECT" in
            '') ;;
            *[[:space:]]*)
              die "select must be comma-separated job names without spaces" ;;
            *)
              # the allowlist is one variable so the error message can
              # never drift from the accepted set
              valid_jobs="hygiene secrets ai-integrity docs node-lint node-test python rust go-lint go-test java cpp csharp ruby php docker security deps-review scorecard"
              for token in $(printf '%s' "$SELECT" | tr ',' ' '); do
                case " $valid_jobs " in
                  *" $token "*) ;;
                  *) die "select contains unknown job '$token' (valid: $valid_jobs)" ;;
                esac
              done ;;
          esac
          echo "caller inputs validated (profile=$PROFILE)"
      - name: Resolve helper repo and ref
        id: repo
        env:
          TEMPLATE_REPO_INPUT: ${{ inputs.template_repo }}
          TEMPLATE_REF_INPUT: ${{ inputs.template_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # GITHUB_WORKFLOW_REF lives in the CALLER's repository, so the
          # auto-detection below is only correct when the caller IS the
          # template repo (selftest, a fork running its own copy). A foreign
          # consumer would be pointed at their own project, and the helper
          # fetch would clone their repo and fail cryptically on a missing
          # tag. Probe for the helper module instead: caller repo keeps the
          # zero-config path, a foreign caller falls back to the upstream
          # template with a loud warning, and an unresolvable setup dies
          # with instructions instead of a red fetch nobody can decode.
          fallback='WasewaseX/master-ci'
          helper='scripts/ai_slop_detector.py'
          # Helper ref resolution, in order:
          #   1. an explicit template_ref input wins (validated above)
          #   2. empty = the calling repository's own commit. Correct ONLY
          #      when the helpers live in the caller (self or fork):
          #      github.workflow_sha is the CALLER's commit even for
          #      cross-repo calls - the canary proved it by fetching
          #      "not our ref" for its own HEAD against the template
          #      repo. So probe caller@SHA for the helper module and pass
          #      only when the helper repo is the caller (or unset).
          #   3. everything else fails meta with pin instructions - a
          #      silent mutable-main fallback is exactly the helper drift
          #      this input exists to prevent.
          caller_ref="${GITHUB_WORKFLOW_REF:-}"
          caller_slug="${caller_ref%%/.github/*}"
          if [ -n "$TEMPLATE_REF_INPUT" ]; then
            template_ref="$TEMPLATE_REF_INPUT"
          elif [ -n "$WORKFLOW_SHA" ] && [ -n "$caller_slug" ] \
            && [ "$caller_slug" != "$caller_ref" ] \
            && { [ -z "$TEMPLATE_REPO_INPUT" ] || [ "$TEMPLATE_REPO_INPUT" = "$caller_slug" ]; } \
            && curl -fsIL "https://raw.githubusercontent.com/$caller_slug/${WORKFLOW_SHA}/$helper" > /dev/null 2>&1; then
            template_ref="$WORKFLOW_SHA"
            echo "::notice::template_ref empty - helpers resolved to the calling repository's own commit (self/fork path)"
          else
            echo "::error::template_ref is empty and the helpers are not available from the calling repository's own commit."
            echo "::error::Pin the helper ref to a release tag, e.g. template_ref: <tag of ${TEMPLATE_REPO_INPUT:-$fallback}>."
            exit 1
          fi
          TEMPLATE_REF="$template_ref"
          echo "template_ref=$template_ref" >> "$GITHUB_OUTPUT"
          has_helpers() {
            curl -fsIL "https://raw.githubusercontent.com/$1/${TEMPLATE_REF}/$helper" > /dev/null 2>&1
          }
          if [ -n "$TEMPLATE_REPO_INPUT" ]; then
            echo "template_repo=$TEMPLATE_REPO_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${GITHUB_WORKFLOW_REF:-}"
          parsed="${ref%%/.github/*}"
          if [ -z "$parsed" ] || [ "$parsed" = "$ref" ]; then
            echo "template_repo=$fallback" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if has_helpers "$parsed"; then
            echo "template_repo=$parsed" >> "$GITHUB_OUTPUT"
          elif has_helpers "$fallback"; then
            # several short annotations instead of one >200-char line
            echo "::warning::template_repo auto-detected as ${parsed}, but it holds no"
            echo "::warning::master-ci helpers at template_ref=${TEMPLATE_REF}; fetching helpers"
            echo "::warning::from ${fallback} instead. Set template_repo (and pin template_ref)"
            echo "::warning::explicitly in your with: block to make this a decision."
            echo "template_repo=$fallback" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no master-ci helpers found at ${parsed}@${TEMPLATE_REF} or ${fallback}@${TEMPLATE_REF}. Set template_repo and template_ref explicitly in your with: block."
            exit 1
          fi
      - name: Resolve enforcement profile
        id: profile
        env:
          PROFILE: ${{ inputs.profile }}
          SEMGREP_INPUT: ${{ inputs.semgrep_config }}
        run: |
          # Profile presets (see docs/checks.md). `custom` uses the raw inputs:
          #   quick    - fast signal, everything advisory except secrets +
          #              critical dependency findings
          #   standard - recommended: deterministic gates enforced, loud
          #              scanners advisory
          #   strict   - production: also enforce Trivy HIGH/CRITICAL
          #   custom   - raw inputs, all gates enforced
          case "$PROFILE" in
            quick)
              semgrep_packs='p/default'
              enforce_osv=false; enforce_trivy=false
              enforce_duplication=false; enforce_complexity=false
              deps_fail_severity=critical ;;
            strict)
              semgrep_packs="$SEMGREP_INPUT"
              enforce_osv=true; enforce_trivy=true
              enforce_duplication=true; enforce_complexity=true
              deps_fail_severity=high ;;
            custom)
              semgrep_packs="$SEMGREP_INPUT"
              enforce_osv=true; enforce_trivy=false
              enforce_duplication=true; enforce_complexity=true
              deps_fail_severity=high ;;
            *)  # standard
              semgrep_packs="$SEMGREP_INPUT"
              enforce_osv=true; enforce_trivy=false
              enforce_duplication=true; enforce_complexity=true
              deps_fail_severity=high ;;
          esac
          {
            echo "semgrep_packs=$semgrep_packs"
            echo "enforce_osv=$enforce_osv"
            echo "enforce_trivy=$enforce_trivy"
            echo "enforce_duplication=$enforce_duplication"
            echo "enforce_complexity=$enforce_complexity"
            echo "deps_fail_severity=$deps_fail_severity"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Change detection: skips every job that has nothing relevant to check
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      cpp: ${{ steps.filter.outputs.cpp }}
      csharp: ${{ steps.filter.outputs.csharp }}
      ruby: ${{ steps.filter.outputs.ruby }}
      php: ${{ steps.filter.outputs.php }}
      docs: ${{ steps.filter.outputs.docs }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 'some-with-excludes' makes '!**/fixtures/**' a real exclusion;
          # the default 'some' quantifier treats negations as matchers.
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**/*.py'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.rs'
              - '**/*.go'
              - '**/*.java'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.rb'
              - '**/*.erb'
              - '**/*.php'
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '**/*.cs'
              - '**/*.fs'
              - '**/*.sh'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
              - '!**/bin/**'
              - '!**/obj/**'
            node:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/biome.json*'
              - '**/tsconfig*.json'
              - '!**/fixtures/**'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            python:
              - '**/*.py'
              - '**/pyproject.toml'
              - '**/requirements*.txt'
              - '**/setup.py'
              - '**/setup.cfg'
              - '**/mypy.ini'
              - '**/ruff.toml'
              - '**/.ruff.toml'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/rust-toolchain*'
              - '**/deny.toml'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '**/go.work'
              - '**/.golangci.yml'
              - '**/.golangci.yaml'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            java:
              - '**/*.java'
              - '**/*.kt'
              - '**/*.kts'
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/build.gradle.kts'
              - '**/settings.gradle'
              - '**/settings.gradle.kts'
              - '**/gradle/wrapper/gradle-wrapper.properties'
              - '**/maven.config'
              - '**/.mvn/**'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - '**/.clang-format'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            csharp:
              - '**/*.cs'
              - '**/*.fs'
              - '**/*.fsproj'
              - '**/*.csproj'
              - '**/*.sln'
              - '**/*.slnx'
              - '**/global.json'
              - '**/nuget.config'
              - '**/Directory.Build.props'
              - '**/Directory.Packages.props'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
              - '!**/bin/**'
              - '!**/obj/**'
            ruby:
              - '**/*.rb'
              - '**/*.erb'
              - '**/Gemfile'
              - '**/Gemfile.lock'
              - '**/*.gemspec'
              - '**/Rakefile'
              - '**/.rubocop.yml'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            php:
              - '**/*.php'
              - '**/composer.json'
              - '**/composer.lock'
              - '**/phpunit.xml'
              - '**/phpunit.xml.dist'
              - '**/phpstan.neon'
              - '**/phpstan.neon.dist'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            docs:
              - '**/*.md'
              - '**/*.mdx'
              - '**/*.rst'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/coverage/**'
              - '!**/node_modules/**'
            workflows:
              - '.github/workflows/**'
              - '.github/labeler.yml'
              - '.github/dependabot.yml'
              - '.github/codeql/**'
            docker:
              - '**/Dockerfile*'
              - '**/*.dockerfile'
              - '**/docker-compose*.yml'
              - '**/docker-compose*.yaml'
              - '**/compose.yml'
              - '**/compose.yaml'
              - '**/.dockerignore'
              - '!**/dist/**'
              - '!**/build/**'
              - '!**/target/**'
              - '!**/vendor/**'
              - '!**/node_modules/**'

  # ---------------------------------------------------------------------------
  # Repo hygiene: workflows, YAML, shell, whitespace, duplication
  # ---------------------------------------------------------------------------
  hygiene:
    needs: [changes, meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',hygiene,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    env:
      CODE_CHANGED: ${{ needs.changes.outputs.code }}
      DUP_THRESHOLD: ${{ inputs.duplication_threshold_pct }}
      DUP_ENFORCE: ${{ needs.meta.outputs.enforce_duplication }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Lint workflow files (actionlint)
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          level: error
          fail_level: error
      - name: Default zizmor policy (if absent)
        # Consumers call Master CI by release tag - the documented setup -
        # which zizmor's default unpinned-uses policy scores as a high
        # finding. Ship a policy that keeps hash-pin for everything else
        # and allows ref-pin for the template's own workflows. Commit your
        # own .github/zizmor.yml to take full control.
        run: |
          [ -f .github/zizmor.yml ] || { mkdir -p .github && cp _ci/configs/zizmor.yml .github/zizmor.yml; }
      - name: Audit workflow security (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: regular
          min-severity: low
          min-confidence: medium
          # findings surface as step annotations; uploading SARIF would
          # require security-events: write on this job
          advanced-security: false
      - name: Lint YAML
        run: |
          pip install --quiet "$(python3 _ci/scripts/tool_versions.py pip yamllint)"
          yamllint -s -c _ci/configs/.yamllint.yaml .
      - name: Check editorconfig compliance
        # the pip package is legacy and no longer builds on Python 3.13;
        # download the maintained release binary directly (with retries)
        run: |
          [ -f .editorconfig ] || cp _ci/configs/.editorconfig .
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/ec.tar.gz \
            https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v4.0.2/editorconfig-checker-linux-amd64.tar.gz
          tar -xzf /tmp/ec.tar.gz -C /tmp
          chmod +x /tmp/editorconfig-checker
          /tmp/editorconfig-checker
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts - skipping"
            exit 0
          fi
          command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y -qq shellcheck
          shellcheck "${files[@]}"
      - name: Flag oversized files
        run: |
          big=$(find . -type f -size +2M \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './_ci/*' -not -path './vendor/*' \
            -not -name '*.lock' -not -name '*-lock.json' | cut -c3- || true)
          if [ -n "$big" ]; then
            while IFS= read -r f; do
              echo "::warning file=$f::File larger than 2MB - commit smaller assets or use LFS"
            done <<< "$big"
          fi
      - name: Detect duplicated code
        if: env.CODE_CHANGED == 'true'
        run: |
          # jscpd: exact pin from configs/tool-versions.yml - a new
          # release must never change duplication behavior mid-CI
          if npx --yes "jscpd@$(python3 _ci/scripts/tool_versions.py npm jscpd)" --silent --min-tokens 50 --threshold "$DUP_THRESHOLD" \
            --reporters console \
            --ignore "**/_ci/**,**/fixtures/**,**/node_modules/**,**/.git/**,**/dist/**,**/build/**,**/target/**" .; then
            exit 0
          fi
          if [ "$DUP_ENFORCE" = "true" ]; then
            exit 1
          fi
          echo "::warning::duplicated code above ${DUP_THRESHOLD}% (advisory in this profile)"

  # ---------------------------------------------------------------------------
  # Secrets: full-history leak detection
  # ---------------------------------------------------------------------------
  secrets:
    needs: [meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',secrets,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan git history for secrets (gitleaks)
        # gitleaks-action v3 requires a paid license for organizations;
        # the checksum-pinned CLI keeps the same full-history scan
        # license-free. Commit a .gitleaks.toml to tune the rules.
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --redact --exit-code 1 --verbose

  # ---------------------------------------------------------------------------
  # AI integrity: slop vocabulary, AI-text tells, humanizer patterns.
  # Advisory by default: prose style never fails a build; blocking signals
  # are deterministic content checks only.
  # ---------------------------------------------------------------------------
  ai-integrity:
    needs: [meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',ai-integrity,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      AI_MAX: ${{ inputs.ai_slop_max_score }}
      AI_CEILING: ${{ inputs.ai_slop_max_deficit }}
      FAIL_SLOP: ${{ inputs.fail_on_ai_slop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Run AI-integrity heuristics
        run: |
          python3 _ci/scripts/ai_slop_detector.py . \
            --max-score "$AI_MAX" \
            --max-slop-score "$AI_CEILING" \
            --report-file ai_report.md \
            --sarif ai_integrity.sarif \
            --annotate
          rc=$?
          if [ -f ai_report.md ]; then
            echo "### AI integrity heuristics" >> "$GITHUB_STEP_SUMMARY"
            cat ai_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FAIL_SLOP" != "true" ] && [ "$rc" -ne 0 ]; then
            echo "fail_on_ai_slop=false - reporting without failing"
            exit 0
          fi
          exit "$rc"
      - name: Upload AI-integrity SARIF
        if: always() && hashFiles('ai_integrity.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ai_integrity.sarif
          category: ai-integrity

  # ---------------------------------------------------------------------------
  # Documentation: markdown lint
  # ---------------------------------------------------------------------------
  docs:
    needs: [changes, meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',docs,')) && needs.meta.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Lint markdown
        run: |
          [ -f .markdownlint-cli2.jsonc ] || cp _ci/configs/.markdownlint-cli2.jsonc .
          npx --yes "$(python3 _ci/scripts/tool_versions.py npm markdownlint-cli2)" "**/*.md" "!**/node_modules/**" \
            "!**/_ci/**" "!**/fixtures/**" "!**/dist/**" "!**/build/**"

  # ---------------------------------------------------------------------------
  # Node / TypeScript stack: lint, format, types, unused deps
  # ---------------------------------------------------------------------------
  node-lint:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',node-lint,'))
      && needs.meta.result == 'success'
      && ((inputs.run_node == 'auto' && needs.changes.outputs.node == 'true') || inputs.run_node == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        # Helper checkout moves ahead of discovery: workspace-aware Node
        # analysis needs the template's project inventory script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Node projects
        # Nested package.json manifests used to trigger this job and then
        # skip silently ("root manifests only"). Discovery makes every
        # project explicit; --fail-empty turns a missing inventory into a
        # loud failure instead of a green no-op.
        run: |
          python3 _ci/scripts/discover_projects.py --family node --format summary
          python3 _ci/scripts/discover_projects.py --family node --list --fail-empty \
            > "$RUNNER_TEMP/node-projects.txt"
      - name: Install pnpm
        if: hashFiles('**/pnpm-lock.yaml') != ''
        # pnpm is a build tool, not project code; version comes from the
        # consumer's lockfile compatibility, so this stays unversioned here.
        run: npm install --global pnpm # zizmor: ignore[adhoc-packages]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ (hashFiles('**/pnpm-lock.yaml') != '' && 'pnpm') || (hashFiles('**/yarn.lock') != '' && 'yarn') || (hashFiles('**/package-lock.json') != '' && 'npm') || '' }}
      - name: Install dependencies
        run: |
          install_one() {
            cd "$1"
            # A lockfile is a contract: when one exists, install reproducibly
            # and treat failures as real failures - never fall back behind a
            # silent || to mutable dependency resolution.
            if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then yarn install --immutable
            elif [ -f package-lock.json ]; then npm ci
            else npm install
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Installing dependencies in $dir"
            install_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Default biome policy (if absent)
        # Biome 2.x formats YAML and Markdown by default, which drags
        # consumer workflow files and prose into the Node stack's gate -
        # YAML hygiene belongs to the hygiene job (yamllint), prose to the
        # docs job. Ship an explicit code-file scope, aligned with the
        # default .editorconfig (spaces, width 2). Commit your own
        # biome.jsonc to take full control.
        run: |
          [ -f biome.jsonc ] || cp _ci/configs/biome.jsonc .
      - name: Lint (project script or biome)
        run: |
          lint_one() {
            cd "$1"
            if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.lint ? 0 : 1)"; then
              npm run lint --silent
            else
              npx --yes "@biomejs/biome@$(python3 _ci/scripts/tool_versions.py npm @biomejs/biome)" ci --no-errors-on-unmatched .
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Linting $dir"
            lint_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Type-check (tsc)
        run: |
          found=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/tsconfig.json" ] || continue
            found=1
            cd "$dir"
            if [ -x node_modules/.bin/tsc ]; then
              node_modules/.bin/tsc --noEmit
            else
              npx --yes -p typescript tsc --noEmit
            fi
            cd "$GITHUB_WORKSPACE"
          done < "$RUNNER_TEMP/node-projects.txt"
          [ "$found" = 1 ] || echo "No tsconfig.json in any project - skipping tsc"
      - name: Flag unused dependencies (depcheck, advisory)
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Depchecking $dir"
            (cd "$dir" && npx --yes "depcheck@$(python3 _ci/scripts/tool_versions.py npm depcheck)" --ignores "@types/*,eslint*,prettier,biome*") \
              || echo "::warning::depcheck flagged unused or missing dependencies in $dir (advisory)"
          done < "$RUNNER_TEMP/node-projects.txt"

  # ---------------------------------------------------------------------------
  # Node / TypeScript stack: tests
  # ---------------------------------------------------------------------------
  node-test:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',node-test,'))
      && needs.meta.result == 'success'
      && ((inputs.run_node == 'auto' && needs.changes.outputs.node == 'true') || inputs.run_node == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Discover Node projects
        run: |
          python3 _ci/scripts/discover_projects.py --family node --format summary
          python3 _ci/scripts/discover_projects.py --family node --list --fail-empty \
            > "$RUNNER_TEMP/node-projects.txt"
      - name: Install pnpm
        if: hashFiles('**/pnpm-lock.yaml') != ''
        # pnpm is a build tool, not project code; version comes from the
        # consumer's lockfile compatibility, so this stays unversioned here.
        run: npm install --global pnpm # zizmor: ignore[adhoc-packages]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ (hashFiles('**/pnpm-lock.yaml') != '' && 'pnpm') || (hashFiles('**/yarn.lock') != '' && 'yarn') || (hashFiles('**/package-lock.json') != '' && 'npm') || '' }}
      - name: Install dependencies
        run: |
          install_one() {
            cd "$1"
            # A lockfile is a contract: when one exists, install reproducibly
            # and treat failures as real failures - never fall back behind a
            # silent || to mutable dependency resolution.
            if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then yarn install --immutable
            elif [ -f package-lock.json ]; then npm ci
            else npm install
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Installing dependencies in $dir"
            install_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"
      - name: Run tests
        run: |
          test_one() {
            cd "$1"
            if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
              if [ -f pnpm-lock.yaml ]; then pnpm test
              elif [ -f yarn.lock ]; then yarn test
              else npm test --silent
              fi
            else
              echo "No test script defined in $1 - skipping"
            fi
            cd "$GITHUB_WORKSPACE"
          }
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Testing $dir"
            test_one "$dir"
          done < "$RUNNER_TEMP/node-projects.txt"

  # ---------------------------------------------------------------------------
  # Python stack: lint, format, types, dead code, complexity, tests
  # ---------------------------------------------------------------------------
  python:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',python,'))
      && needs.meta.result == 'success'
      && ((inputs.run_python == 'auto' && needs.changes.outputs.python == 'true') || inputs.run_python == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    env:
      CX_MAX: ${{ inputs.complexity_max }}
      CX_ENFORCE: ${{ needs.meta.outputs.enforce_complexity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: ${{ (hashFiles('**/requirements*.txt') != '' || hashFiles('**/pyproject.toml') != '') && 'pip' || '' }}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Exact pins from configs/tool-versions.yml: a new analyzer
          # release must never change CI behavior silently. Bump pins by
          # PR after validating the template's own gates. NOTE: the
          # substitution is intentionally UNQUOTED so the pin list word-
          # splits into one argument per tool.
          python -m pip install --quiet \
            $(python3 _ci/scripts/tool_versions.py pip ruff mypy vulture lizard pytest)
      - name: Ruff lint
        run: |
          { [ -f ruff.toml ] || [ -f .ruff.toml ]; } || \
            { grep -q 'tool.ruff' pyproject.toml 2>/dev/null; } || \
            cp _ci/configs/ruff.toml .
          ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: |
          pyfile=$(git ls-files '*.py' | grep -v '^_ci/' | head -n1)
          if [ -z "$pyfile" ]; then
            echo "No python files - skipping mypy"
            exit 0
          fi
          mypy --ignore-missing-imports .
      - name: Vulture dead-code scan (advisory)
        run: |
          vulture . --min-confidence 80 --exclude '_ci,build,dist,vendor' \
            || echo "::warning::vulture flagged possibly dead code (advisory)"
      - name: Lizard complexity gate
        run: |
          out=$(lizard -l python -C "$CX_MAX" -x '_ci/*' . || true)
          echo "$out"
          if echo "$out" | grep -q '!!!!'; then
            if [ "$CX_ENFORCE" = "true" ]; then
              echo "::error file=::functions exceed cyclomatic complexity $CX_MAX"
              exit 1
            fi
            echo "::warning::functions exceed cyclomatic complexity $CX_MAX (advisory in this profile)"
          fi
      - name: Install project
        run: |
          # Installing the project is part of the test contract: a packaging
          # failure must fail loudly, never leave the tests running against a
          # bare environment that happens to pass.
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e . || pip install .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No installable python project - skipping dependency install"
          fi
      - name: Run pytest
        run: |
          if [ -d tests ]; then
            # test suites that parse workflow YAML need PyYAML; it ships with
            # many toolchains but is not a pytest dependency - install on miss
            python -c "import yaml" 2>/dev/null || python -m pip install --quiet pyyaml
            python -m pytest -q
          elif find . -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) \
            -not -path './_ci/*' -not -path './node_modules/*' | grep -q .; then
            python -m pytest -q
          else
            echo "No tests found - skipping pytest"
          fi

  # ---------------------------------------------------------------------------
  # Rust stack: format, clippy, advisories, licenses, tests (shared cache)
  # ---------------------------------------------------------------------------
  rust:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',rust,'))
      && needs.meta.result == 'success'
      && ((inputs.run_rust == 'auto' && needs.changes.outputs.rust == 'true') || inputs.run_rust == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Default cargo-deny policy (if absent)
        # cargo-deny's built-in default has an EMPTY license allow list -
        # even MIT gets rejected. Ship the template's baseline policy;
        # commit your own deny.toml to take full control.
        run: '[ -f deny.toml ] || cp _ci/configs/deny.toml .'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch pin; no version tags published) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Advisories, licenses, sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ''
          command-arguments: advisories licenses sources
      - name: Test
        run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------------
  # Go stack: formatting, vet, golangci-lint (root go.mod only)
  # ---------------------------------------------------------------------------
  go-lint:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',go-lint,'))
      && needs.meta.result == 'success'
      && ((inputs.run_go == 'auto' && needs.changes.outputs.go == 'true') || inputs.run_go == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*/go.mod' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested Go module(s) detected but this job analyzes root manifests only: $nested"
            fi
            echo "No go.mod at repository root - Go stack supports root manifests only"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.manifest == 'true'
        with:
          go-version: ${{ inputs.go_version }}
      - name: Check formatting (gofmt)
        if: steps.detect.outputs.manifest == 'true'
        run: |
          unformatted=$(find . -name '*.go' -type f \
            -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet standard library checks
        if: steps.detect.outputs.manifest == 'true'
        run: go vet ./...
      - name: Lint (golangci-lint)
        if: steps.detect.outputs.manifest == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=10m

  # ---------------------------------------------------------------------------
  # Go stack: build + race-tested tests
  # ---------------------------------------------------------------------------
  go-test:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',go-test,'))
      && needs.meta.result == 'success'
      && ((inputs.run_go == 'auto' && needs.changes.outputs.go == 'true') || inputs.run_go == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*/go.mod' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested Go module(s) detected but this job analyzes root manifests only: $nested"
            fi
            echo "No go.mod at repository root - skipping Go build and tests"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.manifest == 'true'
        with:
          go-version: ${{ inputs.go_version }}
      - name: Build
        if: steps.detect.outputs.manifest == 'true'
        run: go build ./...
      - name: Test (race detector, shuffled)
        if: steps.detect.outputs.manifest == 'true'
        run: go test -race -shuffle=on ./...

  # ---------------------------------------------------------------------------
  # JVM stack (Java, Kotlin, Scala riding Maven or Gradle): wrapper validation,
  # build + verify. Lint and tests ride the build tool's own lifecycle, which
  # is the idiom Maven and Gradle projects already maintain.
  # ---------------------------------------------------------------------------
  java:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',java,'))
      && needs.meta.result == 'success'
      && ((inputs.run_java == 'auto' && needs.changes.outputs.java == 'true') || inputs.run_java == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect JVM build tool
        id: detect
        run: |
          if [ -f pom.xml ] || [ -f mvnw ]; then
            echo "tool=maven" >> "$GITHUB_OUTPUT"
          elif ls build.gradle build.gradle.kts settings.gradle settings.gradle.kts >/dev/null 2>&1; then
            echo "tool=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "tool=none" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*pom.xml' '*build.gradle*' '*settings.gradle*' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested JVM project(s) detected but this job analyzes root builds only: $nested"
            fi
            echo "No pom.xml or Gradle build script at repository root - JVM stack supports root builds only"
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.detect.outputs.tool != 'none'
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ steps.detect.outputs.tool == 'maven' && 'maven' || 'gradle' }}
      - name: Validate Gradle wrapper checksums
        # a wrapper jar that does not match the recorded SHA of its
        # distribution is a supply-chain incident, not a build problem
        if: steps.detect.outputs.tool == 'gradle' && hashFiles('gradle/wrapper/gradle-wrapper.properties') != ''
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and verify (Maven)
        # `verify` runs the full lifecycle the project declares: compile,
        # tests, integration tests, packaging. A red verify is a real red.
        if: steps.detect.outputs.tool == 'maven'
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B -ntp verify
          else
            mvn -B -ntp verify
          fi
      - name: Build and verify (Gradle)
        if: steps.detect.outputs.tool == 'gradle'
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

  # ---------------------------------------------------------------------------
  # C/C++ stack: cppcheck static analysis (advisory), opt-in clang-format
  # gate, then build + ctest through the project's own build system.
  # ---------------------------------------------------------------------------
  cpp:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',cpp,'))
      && needs.meta.result == 'success'
      && ((inputs.run_cpp == 'auto' && needs.changes.outputs.cpp == 'true') || inputs.run_cpp == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect C/C++ build system
        id: detect
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "build=cmake" >> "$GITHUB_OUTPUT"
          elif [ -f Makefile ]; then
            echo "build=make" >> "$GITHUB_OUTPUT"
          else
            echo "build=none" >> "$GITHUB_OUTPUT"
            echo "No CMakeLists.txt or Makefile at repository root - sources are lint-only"
          fi
      - name: Static analysis (cppcheck, advisory)
        run: |
          command -v cppcheck >/dev/null 2>&1 || sudo apt-get install -y -qq cppcheck
          rc=0
          cppcheck --enable=warning,style,performance --inline-suppr \
            --suppress=missingIncludeSystem --std=c++17 -q . || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::cppcheck flagged issues (advisory in every profile)"
          fi
      - name: Check formatting (clang-format, only when the repo opts in)
        # formatting is enforced only where a .clang-format exists: its
        # presence is the project's consent to be formatted at all
        if: hashFiles('.clang-format') != ''
        run: |
          command -v clang-format >/dev/null 2>&1 || sudo apt-get install -y -qq clang-format
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          [ -z "$files" ] && exit 0
          printf '%s\n' "$files" | xargs -n1 clang-format --dry-run -Werror
      - name: Build and test (CMake)
        if: steps.detect.outputs.build == 'cmake'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "No CTest suite registered - skipping ctest"
          fi
      - name: Build (Make)
        if: steps.detect.outputs.build == 'make'
        run: make -j2

  # ---------------------------------------------------------------------------
  # .NET stack (C#, F#): setup-dotnet (global.json wins over the input),
  # release build with implicit restore, tests, advisory format drift.
  # ---------------------------------------------------------------------------
  csharp:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',csharp,'))
      && needs.meta.result == 'success'
      && ((inputs.run_csharp == 'auto' && needs.changes.outputs.csharp == 'true') || inputs.run_csharp == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect .NET project
        id: detect
        run: |
          if ls *.sln *.slnx 2>/dev/null | grep -q .; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          elif ls *.csproj *.fsproj 2>/dev/null | grep -q .; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*/*.csproj' '*/*.fsproj' '*/*.sln' '*/*.slnx' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested .NET project(s) detected but this job analyzes root projects only: $nested"
            fi
            echo "No .sln or .csproj/.fsproj at repository root - .NET stack supports root projects only"
          fi
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        # global.json is the project's own SDK pin and always wins over
        # the dotnet_version input
        if: steps.detect.outputs.project == 'true' && hashFiles('global.json') == ''
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.detect.outputs.project == 'true' && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - name: Build and test
        if: steps.detect.outputs.project == 'true'
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build
      - name: Format drift (dotnet format, advisory)
        # checked only when an .editorconfig exists - adopting the check is
        # a decision the project makes by committing its formatting policy
        if: steps.detect.outputs.project == 'true' && hashFiles('.editorconfig') != ''
        run: |
          rc=0
          dotnet format --verify-no-changes || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::dotnet format found drift (advisory in every profile)"
          fi

  # ---------------------------------------------------------------------------
  # Ruby stack: bundler install with cache, advisory RuboCop and
  # bundler-audit, tests through rake (minitest) or rspec.
  # ---------------------------------------------------------------------------
  ruby:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',ruby,'))
      && needs.meta.result == 'success'
      && ((inputs.run_ruby == 'auto' && needs.changes.outputs.ruby == 'true') || inputs.run_ruby == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Ruby project
        id: detect
        run: |
          if [ -f Gemfile ] || [ -f Rakefile ] || ls *.gemspec >/dev/null 2>&1; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*Gemfile' '*Rakefile' '*.gemspec' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested Ruby project(s) detected but this job analyzes root projects only: $nested"
            fi
            echo "No Gemfile, gemspec or Rakefile at repository root - Ruby stack supports root projects only"
          fi
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: steps.detect.outputs.project == 'true'
        with:
          ruby-version: ${{ inputs.ruby_version }}
          # bundler-cache installs the Gemfile with dependency caching; a
          # gemspec-only project has no Gemfile and must not fail setup
          bundler-cache: ${{ hashFiles('Gemfile') != '' }}
      - name: Lint (RuboCop, advisory)
        if: steps.detect.outputs.project == 'true'
        run: |
          if bundle exec rubocop --version >/dev/null 2>&1; then
            rc=0
            bundle exec rubocop || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::RuboCop flagged offenses (advisory in every profile)"
            fi
          else
            echo "RuboCop is not in the bundle - skipping"
          fi
      - name: Dependency advisories (bundler-audit, advisory)
        if: steps.detect.outputs.project == 'true'
        # the audit gem below is a scanner, not a project dependency; its
        # version is deliberately not locked (advisory step)
        run: | # zizmor: ignore[adhoc-packages]
          if [ -f Gemfile.lock ]; then
            gem install bundler-audit --no-document >/dev/null 2>&1 || true
            rc=0
            bundle-audit check --update || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::bundler-audit flagged vulnerable gems (advisory in every profile)"
            fi
          else
            echo "No Gemfile.lock - skipping bundler-audit"
          fi
      - name: Test suite
        if: steps.detect.outputs.project == 'true'
        run: |
          if [ -d spec ]; then
            bundle exec rspec
          elif [ -d test ]; then
            bundle exec rake test
          else
            echo "No spec/ or test/ directory - skipping Ruby tests"
          fi

  # ---------------------------------------------------------------------------
  # PHP stack: composer install (lockfile-faithful), syntax check over every
  # tracked file, opt-in PHPStan, tests through the composer script or
  # PHPUnit.
  # ---------------------------------------------------------------------------
  php:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',php,'))
      && needs.meta.result == 'success'
      && ((inputs.run_php == 'auto' && needs.changes.outputs.php == 'true') || inputs.run_php == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect PHP project
        id: detect
        run: |
          if [ -f composer.json ]; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
            nested=$(git ls-files '*/composer.json' | head -5 | tr '\n' ' ')
            if [ -n "$nested" ]; then
              echo "::warning::nested PHP project(s) detected but this job analyzes root projects only: $nested"
            fi
            echo "No composer.json at repository root - PHP stack supports root projects only"
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        if: steps.detect.outputs.project == 'true'
        with:
          php-version: ${{ inputs.php_version }}
          coverage: none
      - name: Install dependencies
        # composer install never rewrites composer.lock: a lock drift is a
        # consumer decision, not something CI resolves silently
        if: steps.detect.outputs.project == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax check (php -l)
        if: steps.detect.outputs.project == 'true'
        run: |
          files=$(git ls-files '*.php' | grep -v '^vendor/' || true)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs -r -n1 php -l
          fi
      - name: Static analysis (PHPStan, only when the repo opts in)
        if: steps.detect.outputs.project == 'true'
        run: |
          config=$(ls phpstan.neon.dist phpstan.neon phpstan.neon.dist.php 2>/dev/null | head -1 || true)
          if [ -n "$config" ] && [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "No PHPStan config or dev dependency - skipping"
          fi
      - name: Test suite
        if: steps.detect.outputs.project == 'true'
        run: |
          test_script=$(composer config scripts.test 2>/dev/null || true)
          if [ -n "$test_script" ]; then
            composer test
          elif ls phpunit.xml phpunit.xml.dist >/dev/null 2>&1 && [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No composer test script or PHPUnit config - skipping PHP tests"
          fi

  # ---------------------------------------------------------------------------
  # Docker stack: hadolint lint (advisory), a proof-build per tracked
  # Dockerfile with size reporting, then an image-level Trivy scan whose
  # exit code follows the same enforce_trivy flag as the filesystem scan
  # in the security job (strict enforces).
  # ---------------------------------------------------------------------------
  docker:
    needs: [changes, meta]
    if: >-
      (inputs.select == '' || contains(format(',{0},', inputs.select), ',docker,'))
      && needs.meta.result == 'success'
      && ((inputs.run_docker == 'auto' && needs.changes.outputs.docker == 'true') || inputs.run_docker == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_EXIT: ${{ needs.meta.outputs.enforce_trivy == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover Dockerfiles
        id: files
        run: |
          files=$(git ls-files '*Dockerfile*' '*.dockerfile' | grep -v '^_ci/' || true)
          if [ -z "$files" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No Dockerfiles tracked - skipping"
            exit 0
          fi
          printf '%s\n' "$files" > dockerfiles.txt
          count=$(printf '%s\n' "$files" | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count Dockerfile(s):"
          printf '%s\n' "$files"
      - name: Lint Dockerfiles (hadolint, advisory)
        if: steps.files.outputs.count != '0'
        # checksum recorded from the v2.12.0 release asset at adoption time
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          rc=0
          /tmp/hadolint --no-color $(tr '\n' ' ' < dockerfiles.txt) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::hadolint flagged Dockerfile issues (advisory in every profile; commit .hadolint.yaml to tune)"
          fi
      - name: Build every Dockerfile (no push)
        # One proof-build per tracked Dockerfile - not just the first:
        # a repo with a root image plus service images used to prove only
        # the root one compiles, and breakage elsewhere stayed green.
        # The first tracked Dockerfile keeps the plain sha tag so the
        # Trivy image scan below stays stable; every image gets a
        # per-file tag and a size notice. Multi-arch publishing lives in
        # release-docker.yml.
        if: steps.files.outputs.count != '0'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          first=1
          built=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            safe=$(printf '%s' "$file" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-')
            echo "Building $file"
            context=$(dirname "$file")
            if [ "$first" = 1 ]; then
              docker build --file "$file" --tag "master-ci-ci:$IMAGE_TAG" \
                --tag "master-ci-ci:$safe-$IMAGE_TAG" "$context"
              first=0
            else
              docker build --file "$file" --tag "master-ci-ci:$safe-$IMAGE_TAG" "$context"
            fi
            size=$(docker image inspect "master-ci-ci:$safe-$IMAGE_TAG" --format '{{.Size}}')
            echo "::notice::image $file built - $(numfmt --to=iec "$size" 2>/dev/null || echo "${size}B")"
            built=$((built + 1))
          done < dockerfiles.txt
          echo "Built $built image(s)"
      - name: Scan the built image (Trivy)
        if: steps.files.outputs.count != '0'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: master-ci-ci:${{ github.sha }}
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: ${{ env.TRIVY_EXIT }}
          ignore-unfixed: true
      - name: Upload image-scan SARIF
        if: always() && hashFiles('trivy-image.sarif') != '' && steps.files.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ---------------------------------------------------------------------------
  # Security: semgrep + trivy + osv-scanner, results pushed to the Security tab
  # ---------------------------------------------------------------------------
  security:
    needs: [meta]
    if: (inputs.select == '' || contains(format(',{0},', inputs.select), ',security,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_PACKS: ${{ needs.meta.outputs.semgrep_packs }}
      TRIVY_EXIT: ${{ needs.meta.outputs.enforce_trivy == 'true' && '1' || '0' }}
      OSV_ENFORCE: ${{ needs.meta.outputs.enforce_osv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.meta.outputs.template_repo }}
          ref: ${{ needs.meta.outputs.template_ref }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false
      - name: Copy default semgrepignore
        run: '[ -f .semgrepignore ] || cp _ci/configs/.semgrepignore .'
      - name: Semgrep static analysis
        run: |
          pip install --quiet "$(python3 _ci/scripts/tool_versions.py pip semgrep)"
          read -ra packs <<< "$SEMGREP_PACKS"
          args=()
          for c in "${packs[@]}"; do
            args+=(--config "$c")
          done
          semgrep scan "${args[@]}" --sarif --output semgrep.sarif \
            --metrics=off --quiet .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: ${{ env.TRIVY_EXIT }}
          ignore-unfixed: true
      - name: OSV vulnerability scan
        run: |
          curl -fsSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          rc=0
          ./osv-scanner scan source -r . --format sarif --output-file osv.sarif || rc=$?
          if [ ! -s osv.sarif ]; then
            echo "No package manifests found - skipping OSV gate"
            exit 0
          fi
          if [ "$rc" -ne 0 ] && [ "$OSV_ENFORCE" != "true" ]; then
            echo "::warning::OSV found vulnerable dependencies (advisory in this profile)"
            exit 0
          fi
          exit "$rc"
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Upload OSV SARIF
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # ---------------------------------------------------------------------------
  # Dependency review on pull requests (vulns + license changes).
  # Requires the repository dependency graph; when it is disabled this
  # degrades to an explicit advisory instead of a red infrastructure failure.
  # ---------------------------------------------------------------------------
  deps-review:
    needs: [meta]
    if: github.event_name == 'pull_request' && (inputs.select == '' || contains(format(',{0},', inputs.select), ',deps-review,')) && needs.meta.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEPS_SEVERITY: ${{ needs.meta.outputs.deps_fail_severity }}
    steps:
      - name: Probe dependency graph support
        id: dg
        env:
          # Without this mapping the probe would run unauthenticated, get
          # HTTP 401 on private repos, and dependency review would silently
          # never run at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "dependency-graph compare returned HTTP $code"
      - name: Dependency review
        if: steps.dg.outputs.http == '200'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ env.DEPS_SEVERITY }}
          comment-summary-in-pr: true
      - name: Dependency review unavailable
        if: steps.dg.outputs.http != '200'
        run: |
          echo "::warning::Dependency graph is disabled for this repository - \
          dependency review was skipped (advisory). Enable it under \
          Settings > General > Security > Dependency graph to enforce it."

  # ---------------------------------------------------------------------------
  # OSSF Scorecard on pushes to the default branch. Publishing results
  # (badge/API data) needs id-token: write on this job only.
  # ---------------------------------------------------------------------------
  scorecard:
    # scorecard_publish: false skips the job entirely - callers who opt out
    # then never need the id-token: write grant, as the README promises.
    # Without this gate the job would still run (and demand OIDC) on every
    # push to the default branch, which startup-fails any caller that took
    # the documented way to drop id-token.
    if: >-
      inputs.scorecard_publish
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (inputs.select == '' || contains(format(',{0},', inputs.select), ',scorecard,'))
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ inputs.scorecard_publish }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # ---------------------------------------------------------------------------
  # Dashboard comment on pull requests
  # ---------------------------------------------------------------------------
  dashboard:
    needs: [changes, meta, hygiene, secrets, ai-integrity, docs, node-lint, node-test, python, rust, go-lint, go-test, java, cpp, csharp, ruby, php, docker, security, deps-review, scorecard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      NEEDS_JSON: ${{ toJson(needs.*.result) }}
    steps:
      - name: Build dashboard
        run: |
          python3 - >> dashboard.md <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          labels = [
              ("changes", "Change detection"),
              ("meta", "Helper resolution"),
              ("hygiene", "Repo hygiene"),
              ("secrets", "Secrets"),
              ("ai-integrity", "AI integrity"),
              ("docs", "Docs"),
              ("node-lint", "Node lint"),
              ("node-test", "Node tests"),
              ("python", "Python"),
              ("rust", "Rust"),
              ("go-lint", "Go lint"),
              ("go-test", "Go tests"),
              ("java", "JVM (Java/Kotlin)"),
              ("cpp", "C/C++"),
              ("csharp", ".NET (C#/F#)"),
              ("ruby", "Ruby"),
              ("php", "PHP"),
              ("docker", "Docker"),
              ("security", "Security"),
              ("deps-review", "Dependency review"),
              ("scorecard", "Scorecard"),
          ]
          icon = {
              "success": "white_check_mark",
              "failure": "x",
              "cancelled": "no_entry_sign",
              "skipped": "fast_forward",
          }
          print("| Check | Result |")
          print("|---|---|")
          for (name, label), result in zip(labels, results):
              state = icon.get(result, "question")
              print(f"| {label} (`{name}`) | :{state}: `{result}` |")
          print()
          print("Findings: Security tab, inline annotations, step summaries.")
          PY
      - name: Post dashboard comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- master-ci-dashboard -->\n' +
              fs.readFileSync('dashboard.md', 'utf8');
            const opts = { owner: context.repo.owner, repo: context.repo.repo };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...opts,
              issue_number: context.issue.number,
            });
            const mine = comments.find(
              (c) =>
                c.user &&
                c.user.login === 'github-actions[bot]' &&
                c.body &&
                c.body.includes('<!-- master-ci-dashboard -->'),
            );
            if (mine) {
              await github.rest.issues.updateComment({ ...opts, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...opts,
                issue_number: context.issue.number,
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # Single required check: fails when any non-skipped job failed
  # ---------------------------------------------------------------------------
  ci-success:
    needs: [changes, meta, hygiene, secrets, ai-integrity, docs, node-lint, node-test, python, rust, go-lint, go-test, java, cpp, csharp, ruby, php, docker, security, deps-review, scorecard]
    if: always()
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
    env:
      NEEDS_JSON: ${{ toJson(needs.*.result) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Aggregate results
        id: aggregate
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          names = [
              "changes",
              "meta",
              "hygiene",
              "secrets",
              "ai-integrity",
              "docs",
              "node-lint",
              "node-test",
              "python",
              "rust",
              "go-lint",
              "go-test",
              "java",
              "cpp",
              "csharp",
              "ruby",
              "php",
              "docker",
              "security",
              "deps-review",
              "scorecard",
          ]
          labels = {
              "changes": "Change detection",
              "meta": "Helper resolution",
              "hygiene": "Repo hygiene",
              "secrets": "Secrets",
              "ai-integrity": "AI integrity",
              "docs": "Docs",
              "node-lint": "Node lint",
              "node-test": "Node tests",
              "python": "Python",
              "rust": "Rust",
              "go-lint": "Go lint",
              "go-test": "Go tests",
              "java": "JVM (Java/Kotlin)",
              "cpp": "C/C++",
              "csharp": ".NET (C#/F#)",
              "ruby": "Ruby",
              "php": "PHP",
              "docker": "Docker",
              "security": "Security",
              "deps-review": "Dependency review",
              "scorecard": "Scorecard",
          }
          icon = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":no_entry_sign:",
              "skipped": ":fast_forward:",
          }
          failed = False
          rows = []
          for name, result in zip(names, results):
              if result in ("failure", "cancelled"):
                  failed = True
              rows.append(f"| {labels[name]} (`{name}`) | {icon.get(result, ':question:')} `{result}` |")
          verdict = "failed" if failed else "passed"
          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as handle:
                  handle.write(f"verdict={verdict}\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Master CI summary\n\n")
                  handle.write(f"**Result: {verdict}** - [view run]({os.environ['RUN_URL']})\n\n")
                  handle.write("| Check | Result |\n")
                  handle.write("|---|---|\n")
                  handle.write("\n".join(rows) + "\n\n")
                  handle.write(
                      "Security findings live in the **Security** tab (code scanning) "
                      "and as inline annotations on pull requests.\n"
                  )
          raise SystemExit(1 if failed else 0)
          PY
