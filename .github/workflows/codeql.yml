# =============================================================================
# CodeQL Advanced - reusable security + quality analysis workflow
# =============================================================================
# Standalone from Master CI so it can run on its own schedule or matrix.
# Free on public repositories. Call it with one line - languages are
# auto-detected from the manifests the repo already commits:
#   uses: WasewaseX/master-ci/.github/workflows/codeql.yml@v2
# Explicit languages: still works for repos that want to pin the dialects.
# =============================================================================

name: CodeQL Advanced

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          Comma-separated CodeQL languages (javascript-typescript, python,
          go, java-kotlin, c-cpp, ruby, rust, swift) or 'auto' to detect
          them from the repository's committed manifests
        required: false
        type: string
        default: auto
      queries:
        description: CodeQL query suites (security-extended, security-and-quality)
        required: false
        type: string
        default: security-and-quality
      config_file:
        description: Optional path to a CodeQL config file inside the calling repo
        required: false
        type: string
        default: ''
      template_repo:
        description: Repo holding the language detector (override for forks)
        required: false
        type: string
        default: WasewaseX/master-ci
      template_ref:
        description: >-
          Ref of template_repo to fetch the detector from. The v2 tag moves
          with every release; pin an exact vX.Y.Z tag to freeze detection
          behavior.
        required: false
        type: string
        default: v2

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.split.outputs.languages }}
    steps:
      - name: Check out the calling repository
        if: inputs.languages == 'auto'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the language detector from the template
        if: inputs.languages == 'auto'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.template_repo }}
          ref: ${{ inputs.template_ref }}
          path: _ci
          persist-credentials: false
      - name: Auto-detect CodeQL languages
        id: detect
        if: inputs.languages == 'auto'
        run: |
          # The detector rides the template checkout so the manifest map
          # cannot drift between what this workflow runs and what its
          # tests pin. Nothing analyzable is exit 2 - fail closed with
          # guidance, never an empty analysis.
          python3 _ci/scripts/codeql_detect.py --root . --format gh-output
      - name: Split and validate languages
        id: split
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LANGUAGES: ${{ inputs.languages == 'auto' && steps.detect.outputs.languages || inputs.languages }}
        with:
          script: |
            const allowed = new Set([
              'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript',
              'python', 'ruby', 'rust', 'swift',
            ]);
            const langs = (process.env.LANGUAGES || '')
              .split(',')
              .map((s) => s.trim())
              .filter(Boolean);
            if (!langs.length) {
              throw new Error('No CodeQL languages configured');
            }
            const unknown = langs.filter((l) => !allowed.has(l));
            if (unknown.length) {
              throw new Error(
                `Unknown CodeQL language(s): ${unknown.join(', ')}. ` +
                `Supported: ${[...allowed].join(', ')}`,
              );
            }
            core.setOutput('languages', JSON.stringify(langs));

  analyze:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.prepare.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure CodeQL config exists
        if: inputs.config_file == ''
        run: |
          cfg=".github/codeql/codeql-config.yml"
          if [ ! -f "$cfg" ]; then
            mkdir -p .github/codeql
            printf 'name: "master-ci default CodeQL config"\n\npaths-ignore:\n  - node_modules\n  - dist\n  - build\n  - target\n  - vendor\n  - coverage\n' > "$cfg"
          fi
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}
          config-file: ${{ inputs.config_file != '' && inputs.config_file || '.github/codeql/codeql-config.yml' }}
      - name: Build compiled languages
        if: contains(fromJSON('["c-cpp", "go", "java-kotlin", "rust", "swift"]'), matrix.language)
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
