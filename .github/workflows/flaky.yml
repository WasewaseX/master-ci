# =============================================================================
# Flaky Test Hunt - weekly proof that green means green
# =============================================================================
# Test assurance's third leg, beside the coverage gate (which lines ran)
# and mutation testing (would the assertions notice). A flaky test makes
# green a coin flip: the suite passes on the retry nobody recorded. The
# hunt runs a repository's own test suite several times in one job and
# reports every test whose verdict changed between iterations.
#
# Per project since v2.11.2: the discovery step enumerates every project
# discover_projects.py finds across all families (the workspace root
# always included, so root-level suites keep hunting), and every family
# hunts every project that claims it - in its own results directory,
# flaky-results/<project>/<suite>/. The classification step then names
# every suite in the summary's status table: hunted (with counts),
# skipped (with the reason) or failed-hunt (loudly). A skipped suite is
# no longer indistinguishable from a completed hunt, and one project's
# failure never hides another project's result - the per-project loops
# fail at the end, the same contract mutation.yml has carried since
# v2.11.1.
#
# The Python hunt installs the project's dependencies and a pinned
# pytest before iterating (pre-v2.11.2 it ran `python -m pytest` against
# whatever the runner happened to have); the project's own pytest, if
# it declares one, wins. The Node hunt recognizes vitest and jest
# through config files OR through the package manifest's dependencies,
# so projects relying on default runner configuration are hunted too.
#
# Opt-in by declaration, like mutation testing: a committed
# .flaky-baseline.json (the quarantine list) arms --fail-on-flaky, so a
# NEW flaky test fails the hunt; known flakes are reported without
# failing, because quarantining real regressions would hide them. A repo
# without a baseline gets the report only - adopt enforcement by
# committing the baseline the first hunt produces.
#
# The hunt never edits tests and never reruns CI: it is a scheduled
# measurement with an artifact, a step summary and an exit code. A runner
# that exists but produces no result file fails closed - a hunt
# that cannot be executed loudly is never a silent pass.
#
# The quarantine loop (v2.4): when the hunt fails on new flakes in
# enforcement mode, a second job turns the verdict into a reviewable PR
# against .flaky-baseline.json. flaky_quarantine.py proposes the merge
# (append-only: existing first_seen preserved verbatim, healed flakes
# never removed - removal is a reviewed commit) and the quarantine job
# independently verifies the candidate against the default branch before
# opening it. Unlike self-heal, an open quarantine PR is updated in
# place: the baseline is recomputed from the default branch each hunt,
# so the update carries no accumulating state. Closing the PR rejects
# the quarantine; merging it silences only the listed tests. The loop is
# gated three ways: the hunt's data verdict says new-flakes, a committed
# baseline exists, and the run targets the default branch (a dispatch on
# a feature branch hunts, but never quarantines). The write-holding job
# runs none of the repo's test code - the hunt stays read-only.
#
# Since v2.10 this workflow is also a reusable workflow: a consumer calls
# it from its own scheduled (or dispatched) wrapper, because a called
# workflow cannot carry a schedule trigger:
#   uses: WasewaseX/master-ci/.github/workflows/flaky.yml@v2.10.0
# The helper defaults follow the codeql.yml and mutation.yml contract -
# template_repo is explicit so a cross-repo call never fetches helpers
# from the caller (GITHUB_WORKFLOW_REF names the caller's workflow
# there), and template_ref defaults to the moving v2 tag; pin an exact
# vX.Y.Z to freeze behavior. The quarantine loop keeps its caller-side
# boundaries: the PR opens against the caller's default branch only
# when the caller's checkout holds the committed baseline, and the
# write-holding job still runs none of the caller's test code.
# =============================================================================

name: Flaky Test Hunt

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_call:
    inputs:
      iterations:
        description: Test-suite repetitions (2-5)
        required: false
        type: string
        default: '3'
      template_repo:
        description: Repo holding master-ci helpers (override for forks)
        required: false
        type: string
        default: WasewaseX/master-ci
      template_ref:
        description: >-
          Ref of template_repo to fetch helpers from. The v2 tag moves
          with every release; pin an exact vX.Y.Z tag to freeze behavior.
        required: false
        type: string
        default: v2
  workflow_dispatch:
    inputs:
      iterations:
        description: Test-suite repetitions (2-5)
        required: false
        type: string
        default: '3'
      template_repo:
        description: Repo holding master-ci helpers (auto-detected when empty)
        required: false
        type: string
        default: ''
      template_ref:
        description: Ref of the master-ci repo to fetch helpers from
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: flake-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      status: ${{ steps.verdict.outputs.status }}
      enforcement: ${{ steps.verdict.outputs.enforcement }}
    env:
      ITERATIONS: ${{ inputs.iterations || '3' }}
      TEMPLATE_REPO_INPUT: ${{ inputs.template_repo }}
      TEMPLATE_REF: ${{ inputs.template_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate helper ref
        run: |
          case "$TEMPLATE_REF" in
            -*|*..*|*[!A-Za-z0-9._/-]*)
              echo "::error::template_ref contains unsafe characters or sequences"
              exit 1 ;;
          esac

      - name: Resolve helper repo
        id: repo
        run: |
          fallback='WasewaseX/master-ci'
          if [ -n "$TEMPLATE_REPO_INPUT" ]; then
            echo "template_repo=$TEMPLATE_REPO_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${GITHUB_WORKFLOW_REF:-}"
          parsed="${ref%%/.github/*}"
          if [ -n "$parsed" ] && [ "$parsed" != "$ref" ]; then
            echo "template_repo=$parsed" >> "$GITHUB_OUTPUT"
          else
            echo "template_repo=$fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repo.outputs.template_repo }}
          ref: ${{ env.TEMPLATE_REF }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false

      - name: Clamp iterations
        run: |
          case "$ITERATIONS" in
            2|3|4|5) ;;
            *) echo "::error::iterations must be 2-5 (got '$ITERATIONS')"; exit 1 ;;
          esac
          mkdir -p flaky-results

      - name: Discover flaky-hunt projects
        # Discovery enumerates every independent project across all
        # families; the workspace root is appended unconditionally so
        # root-level suites keep hunting exactly as before. Each family
        # step scans the same list for its own manifest and skips the
        # projects that do not claim it - per project, with the skip
        # named in the summary. Discovery failing (a declared workspace
        # that cannot be honored) fails closed.
        id: discover
        run: |
          { python3 _ci/scripts/discover_projects.py --family all --list
            echo '.'
          } | sort -u > "$RUNNER_TEMP/flaky-dirs.txt"
          python_hunt=0; node_hunt=0; go_hunt=0; rust_hunt=0
          jvm_hunt=0; dotnet_hunt=0; ruby_hunt=0; php_hunt=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Scanning $dir for test suites"
            if [ -f "$dir/pyproject.toml" ] || [ -f "$dir/pytest.ini" ] || [ -f "$dir/setup.cfg" ]; then
              python_hunt=1
            fi
            if [ -f "$dir/package.json" ]; then node_hunt=1; fi
            if [ -f "$dir/go.mod" ]; then go_hunt=1; fi
            if [ -f "$dir/Cargo.toml" ]; then rust_hunt=1; fi
            if [ -f "$dir/pom.xml" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              jvm_hunt=1
            fi
            if ls "$dir"/*.csproj >/dev/null 2>&1 || ls "$dir"/*.fsproj >/dev/null 2>&1; then
              dotnet_hunt=1
            fi
            if [ -f "$dir/Gemfile" ]; then ruby_hunt=1; fi
            if [ -f "$dir/composer.json" ]; then php_hunt=1; fi
          done < "$RUNNER_TEMP/flaky-dirs.txt"
          {
            echo "python=$python_hunt"
            echo "node=$node_hunt"
            echo "go=$go_hunt"
            echo "rust=$rust_hunt"
            echo "jvm=$jvm_hunt"
            echo "dotnet=$dotnet_hunt"
            echo "ruby=$ruby_hunt"
            echo "php=$php_hunt"
          } >> "$GITHUB_OUTPUT"

      # --- toolchains, only when a discovered project claims the family ---
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: always() && steps.discover.outputs.python == '1'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always() && steps.discover.outputs.node == '1'
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: always() && steps.discover.outputs.go == '1'
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: always() && steps.discover.outputs.rust == '1'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: always() && steps.discover.outputs.jvm == '1'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: always() && steps.discover.outputs.dotnet == '1'
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: always() && steps.discover.outputs.ruby == '1'
        with:
          # the action fails closed without it: "input ruby-version needs
          # to be specified if no .ruby-version or .tool-versions file
          # exists" - the ci-canary was the first hosted consumer with a
          # Gemfile and no version file, and the setup died before the
          # hunt could run. Same default as the Ruby stack job. The
          # bundler cache is per project now: setup-ruby's root-level
          # cache could not see a nested project's Gemfile.
          ruby-version: '3.4'
          bundler-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        if: always() && steps.discover.outputs.php == '1'
        with:
          php-version: '8.4'
          coverage: none

      # --- per-family, per-project hunts: fail at the end, name the skip ---
      - name: Hunt Python flakes (pytest) - every discovered project
        if: always() && steps.discover.outputs.python == '1'
        run: |
          rc_total=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            { [ -f "$dir/pyproject.toml" ] || [ -f "$dir/pytest.ini" ] || [ -f "$dir/setup.cfg" ]; } || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/python"
            mkdir -p "$results"
            echo "::group::pytest in $dir"
            rc=0
            (
              cd "$dir" || exit 1
              # The pinned pytest lands first as the fallback; the
              # project's own dependency install may bring a different
              # one, and the project's version wins - the suite is
              # hunted with the runner it ships. The install contract
              # mirrors the python stack job: a packaging failure fails
              # loudly instead of measuring a bare environment.
              # shellcheck disable=SC2046
              python -m pip install --quiet $(python3 "$GITHUB_WORKSPACE/_ci/scripts/tool_versions.py" pip pytest)
              if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
                pip install -e . || pip install .
              elif [ -f requirements.txt ]; then
                pip install -r requirements.txt
              else
                echo "No installable python project in $dir - the suite runs against the bare environment"
              fi
              for i in $(seq 1 "$ITERATIONS"); do
                python -m pytest -q --junitxml="$results/run-$i.xml" || true
                [ -s "$results/run-$i.xml" ] || \
                  echo "::warning::pytest iteration $i in $dir produced no report"
              done
            ) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$dir::the Python hunt could not run in $dir (exit $rc)"
              rc_total=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"
          exit $rc_total

      - name: Hunt Node flakes (vitest / jest) - every discovered project
        if: always() && steps.discover.outputs.node == '1'
        run: | # zizmor: ignore[adhoc-packages]
          rc_total=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/package.json" ] || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/node"
            mkdir -p "$results"
            echo "::group::node hunt in $dir"
            runner=''
            if [ -f "$dir/vitest.config.ts" ] || [ -f "$dir/vitest.config.js" ] || [ -f "$dir/vitest.config.mts" ]; then
              runner=vitest
            elif [ -f "$dir/jest.config.js" ] || [ -f "$dir/jest.config.ts" ] || [ -f "$dir/jest.config.mjs" ]; then
              runner=jest
            elif (cd "$dir" && node -e 'const p=require("./package.json");const d=Object.assign({},p.dependencies,p.devDependencies);process.exit(d.vitest?0:1)' 2>/dev/null); then
              # v2.11.2: a runner declared in the manifest is a runner,
              # even without a committed config file
              runner=vitest
            elif (cd "$dir" && node -e 'const p=require("./package.json");const d=Object.assign({},p.dependencies,p.devDependencies);process.exit(d.jest?0:1)' 2>/dev/null); then
              runner=jest
            fi
            if [ -z "$runner" ]; then
              echo "no vitest or jest config or dependency in $dir - the Node suite is not hunted"
              echo "no vitest or jest config or dependency in package.json" > "$results/status.txt"
              echo "::endgroup::"
              continue
            fi
            rc=0
            (
              cd "$dir" || exit 1
              # A lockfile is a contract, same as the node jobs - and the
              # package manager is activated before it runs.
              if [ -f pnpm-lock.yaml ]; then
                npm install --global pnpm
                pnpm install --frozen-lockfile
              elif [ -f yarn.lock ]; then
                corepack enable
                yarn install --immutable
              elif [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              if [ "$runner" = jest ]; then
                npm install --no-save jest-junit
              fi
              for i in $(seq 1 "$ITERATIONS"); do
                if [ "$runner" = vitest ]; then
                  npx vitest run --reporter=junit \
                    --outputFile="$results/run-$i.xml" || true
                else
                  JEST_JUNIT_OUTPUT_FILE="$results/run-$i.xml" \
                    npx jest --ci --reporters=default --reporters=jest-junit || true
                fi
                [ -s "$results/run-$i.xml" ] || \
                  echo "::warning::Node iteration $i in $dir produced no report"
              done
            ) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$dir::the Node hunt could not run in $dir (exit $rc)"
              rc_total=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"
          exit $rc_total

      - name: Hunt Go flakes (go test -json) - every discovered project
        if: always() && steps.discover.outputs.go == '1'
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/go.mod" ] || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/go"
            mkdir -p "$results"
            echo "::group::go hunt in $dir"
            for i in $(seq 1 "$ITERATIONS"); do
              (cd "$dir" && go test -json ./...) > "$results/run-$i.gojson" || true
              [ -s "$results/run-$i.gojson" ] || \
                echo "::warning::go iteration $i in $dir produced no stream"
            done
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"

      - name: Hunt Rust flakes (cargo test) - every discovered project
        if: always() && steps.discover.outputs.rust == '1'
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/Cargo.toml" ] || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/rust"
            mkdir -p "$results"
            echo "::group::rust hunt in $dir"
            for i in $(seq 1 "$ITERATIONS"); do
              (cd "$dir" && cargo test) > "$results/run-$i.libtest" || true
              [ -s "$results/run-$i.libtest" ] || \
                echo "::warning::cargo iteration $i in $dir produced no output"
            done
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"

      - name: Hunt JVM flakes (Maven / Gradle) - every discovered project
        if: always() && steps.discover.outputs.jvm == '1'
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            { [ -f "$dir/pom.xml" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; } || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/jvm"
            mkdir -p "$results"
            echo "::group::JVM hunt in $dir"
            for i in $(seq 1 "$ITERATIONS"); do
              if [ -f "$dir/pom.xml" ]; then
                (cd "$dir" && mvn -B test) || true
              else
                # One attempt per iteration - a retry would mask the very
                # flakiness the hunt measures.
                if [ -f "$dir/gradlew" ]; then
                  (cd "$dir" && chmod +x gradlew && ./gradlew test) || true
                else
                  (cd "$dir" && gradle test) || true
                fi
              fi
              n=0
              while IFS= read -r f; do
                cp "$f" "$results/run-$i-${f##*/TEST-}"
                n=$((n + 1))
              done < <(find "$dir" -type f \( -path '*/target/surefire-reports/TEST-*.xml' \
                -o -path '*/build/test-results/test/TEST-*.xml' \))
              [ "$n" -gt 0 ] || echo "::warning::JVM iteration $i in $dir produced no XML"
            done
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"

      - name: Hunt .NET flakes (dotnet test) - every discovered project
        if: always() && steps.discover.outputs.dotnet == '1'
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            { ls "$dir"/*.csproj >/dev/null 2>&1 || ls "$dir"/*.fsproj >/dev/null 2>&1; } || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/dotnet"
            mkdir -p "$results"
            echo "::group::dotnet hunt in $dir"
            for i in $(seq 1 "$ITERATIONS"); do
              (cd "$dir" && dotnet test --logger "trx;LogFilePrefix=raw-$i-" \
                --results-directory "$results") || true
              for f in "$results"/raw-"$i"-*.trx; do
                [ -f "$f" ] || continue
                mv "$f" "$results/run-$i-${f##*/raw-"$i"-}"
              done
              ls "$results"/run-"$i"-*.trx >/dev/null 2>&1 || \
                echo "::warning::dotnet iteration $i in $dir produced no TRX"
            done
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"

      - name: Hunt Ruby flakes (RSpec) - every discovered project
        if: always() && steps.discover.outputs.ruby == '1'
        run: |
          rc_total=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/Gemfile" ] || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/ruby"
            mkdir -p "$results"
            echo "::group::ruby hunt in $dir"
            if ! (cd "$dir" && grep -q rspec_junit_formatter Gemfile); then
              echo "add rspec_junit_formatter to the Gemfile in $dir to hunt Ruby flakes"
              echo "no rspec_junit_formatter in the Gemfile" > "$results/status.txt"
              echo "::endgroup::"
              continue
            fi
            rc=0
            (
              cd "$dir" || exit 1
              # The project's own bundle, per project: the root-level
              # cache could not see a nested project's Gemfile.
              bundle install --quiet
              for i in $(seq 1 "$ITERATIONS"); do
                bundle exec rspec --format RspecJunitFormatter \
                  --out "$results/run-$i.xml" || true
                [ -s "$results/run-$i.xml" ] || \
                  echo "::warning::RSpec iteration $i in $dir produced no report"
              done
            ) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$dir::the Ruby hunt could not run in $dir (exit $rc)"
              rc_total=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"
          exit $rc_total

      - name: Hunt PHP flakes (PHPUnit) - every discovered project
        if: always() && steps.discover.outputs.php == '1'
        run: |
          rc_total=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ -f "$dir/composer.json" ] || continue
            if [ "$dir" = "." ]; then slug=root; else slug=$(printf '%s' "$dir" | tr '/ ' '--'); fi
            results="$GITHUB_WORKSPACE/flaky-results/$slug/php"
            mkdir -p "$results"
            echo "::group::php hunt in $dir"
            rc=0
            (
              cd "$dir" || exit 1
              composer install --no-interaction --no-progress
              for i in $(seq 1 "$ITERATIONS"); do
                vendor/bin/phpunit --log-junit "$results/run-$i.xml" || true
                [ -s "$results/run-$i.xml" ] || \
                  echo "::warning::PHPUnit iteration $i in $dir produced no report"
              done
            ) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$dir::the PHP hunt could not run in $dir (exit $rc)"
              rc_total=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/flaky-dirs.txt"
          exit $rc_total

      # --- classify: every suite named, skips visible, one merged verdict ---
      - name: Classify every hunted suite
        if: always()
        run: |
          set -o pipefail
          args="--results-root flaky-results --iterations $ITERATIONS"
          if [ -f .flaky-baseline.json ]; then
            args="$args --baseline .flaky-baseline.json --fail-on-flaky"
          else
            echo "No .flaky-baseline.json committed - report-only mode."
            echo "Adopt enforcement by committing the baseline this run produces."
          fi
          # args accumulates CLI flags by design; word splitting is the point.
          # shellcheck disable=SC2086
          python3 _ci/scripts/flaky_aggregate.py $args
      - name: Verdict for the quarantine loop
        if: always()
        id: verdict
        run: |
          if [ -f flaky-report.json ]; then
            status=$(python3 -c \
              "import json; print(json.load(open('flaky-report.json')).get('status', 'none'))")
          else
            status=none
          fi
          if [ -f .flaky-baseline.json ]; then enforcement=true; else enforcement=false; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "enforcement=$enforcement" >> "$GITHUB_OUTPUT"
      - name: Build the quarantine proposal
        # always(): a failed hunt is exactly when a proposal is wanted.
        # The report gate mirrors the hunt's reach: no merged report
        # means no suite was hunted, so there is no verdict and no
        # proposal. The candidate is written to RUNNER_TEMP, outside the
        # worktree: it must never leak into the PR branch through this
        # job's checkout.
        if: always() && hashFiles('flaky-report.json') != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 _ci/scripts/flaky_quarantine.py propose \
            --report flaky-report.json \
            --baseline .flaky-baseline.json \
            --out "$RUNNER_TEMP/quarantine" \
            --run-url "$RUN_URL"
      - name: Upload the quarantine proposal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-quarantine
          path: ${{ runner.temp }}/quarantine
          if-no-files-found: ignore
      - name: Upload hunt report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-report
          path: flaky-report.json
          if-no-files-found: ignore
      - name: Summary
        if: always()
        run: |
          {
            echo "## Flaky test hunt"
            echo ""
            if [ -f flaky-summary.md ]; then
              cat flaky-summary.md
            else
              echo "No supported test runner found (Python, Node, Go, Rust, JVM,"
              echo ".NET, Ruby, PHP) - nothing ran; this is not a pass or a fail."
            fi
            echo ""
            echo "Quarantine semantics: a committed \`.flaky-baseline.json\` records"
            echo "known flakes; the hunt fails on a *new* flaky test and celebrates"
            echo "healed ones. Rewrite the floor with"
            echo "\`python3 _ci/scripts/flaky_detect.py --results-dir <suite-dir> --write-baseline\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The write half of the loop. It runs none of the repository's test
  # code (the hunt already did that, read-only): it re-verifies the
  # candidate against the default branch, then opens one PR whose only
  # possible change is the baseline file. Closing the PR rejects the
  # quarantine; nothing is ever pushed to the default branch.
  quarantine:
    needs: hunt
    if: >-
      needs.hunt.outputs.status == 'new-flakes' &&
      needs.hunt.outputs.enforcement == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      TEMPLATE_REPO_INPUT: ${{ inputs.template_repo }}
      TEMPLATE_REF: ${{ inputs.template_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate helper ref
        run: |
          case "$TEMPLATE_REF" in
            -*|*..*|*[!A-Za-z0-9._/-]*)
              echo "::error::template_ref contains unsafe characters or sequences"
              exit 1 ;;
          esac

      - name: Resolve helper repo
        id: repo
        run: |
          fallback='WasewaseX/master-ci'
          if [ -n "$TEMPLATE_REPO_INPUT" ]; then
            echo "template_repo=$TEMPLATE_REPO_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${GITHUB_WORKFLOW_REF:-}"
          parsed="${ref%%/.github/*}"
          if [ -n "$parsed" ] && [ "$parsed" != "$ref" ]; then
            echo "template_repo=$parsed" >> "$GITHUB_OUTPUT"
          else
            echo "template_repo=$fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch master-ci helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.repo.outputs.template_repo }}
          ref: ${{ env.TEMPLATE_REF }}
          path: _ci
          fetch-depth: 1
          persist-credentials: false

      - name: Download the hunt's evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-*
          path: evidence
          merge-multiple: true

      - name: Verify the candidate against the default branch
        run: |
          # The independent second opinion: candidate == committed
          # baseline union the report's new flakes, nothing removed, no
          # rewritten history. A hunt that cannot prove its proposal
          # never opens a PR.
          python3 _ci/scripts/flaky_quarantine.py verify \
            --merged evidence/baseline.json \
            --baseline .flaky-baseline.json \
            --report evidence/flaky-report.json

      - name: Assemble the PR body
        run: |
          {
            echo "Opened automatically because the flake hunt failed on new"
            echo "flaky test(s) on the default branch (run: $RUN_URL)."
            echo
            cat evidence/body.md
          } > "$RUNNER_TEMP/final-body.md"
          {
            echo "## Quarantine proposal"
            echo ""
            cat evidence/body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the quarantine PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
          branch: ci/flake-quarantine
          title: 'ci: quarantine the new flaky test(s)'
          body-file: "$RUNNER_TEMP/final-body.md"
          labels: |
            automation
            flake
          commit-message: 'ci: quarantine the new flaky test(s)'
          add-paths: .flaky-baseline.json
