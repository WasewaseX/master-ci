# =============================================================================
# Self-Heal - reactive response to a red default branch
# =============================================================================
# workflow_run is used ONLY to react to CI failures on the default branch;
# no untrusted code is checked out or executed (fixers run against the
# repository's own default branch, and all changes land through a
# reviewable PR, never a push).
#
# When CI fails on the default branch, this workflow applies the repo's
# fix policy via scripts/fix_engine.py - the exact same engine the weekly
# Autofix workflow uses - and opens/updates the `ci/autofix` PR. Merge the
# PR and the branch is green again: the loop closes itself. If the failure
# was not mechanically fixable, the PR comes back empty-handed and the
# cause needs a human.
#
# Circuit breakers (a self-healing loop must never loop forever):
#   1. It only reacts to failures on the DEFAULT branch. Failures on fix
#      PRs or feature branches never trigger another heal.
#   2. If a `ci/autofix` PR is already open it stops: a failing fix PR
#      needs a human, not another iteration.
#   3. It never pushes to a branch - all changes land as one reviewable PR,
#      and closing the PR is the rollback.
#   4. A fixed concurrency group serializes heals; nothing runs in parallel.
#
# PRs created with GITHUB_TOKEN intentionally do not re-trigger workflows.
# To have Master CI run on the heal PR automatically, store a PAT with
# `repo` + `workflow` scopes as the AUTOFIX_TOKEN repository secret.
# =============================================================================

name: Self-Heal

on:
  # zizmor: ignore[dangerous-triggers] - reactive self-heal on default-branch
  # CI failures only; no untrusted checkout, no push, PR-only changes
  workflow_run:
    workflows: ["CI", "Master CI", "Master CI Selftest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  heal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Circuit breaker - skip when a fix PR is already open
        id: breaker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --head ci/autofix --state open --json number --jq 'length')
          if [ "$prs" -gt 0 ]; then
            echo "::notice::ci/autofix PR is already open - not healing over it; merge or close it first"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fix tools
        if: steps.breaker.outputs.skip != 'true'
        run: |
          python -m pip install --quiet ruff sqlfluff semgrep

      - name: Apply the fix policy
        if: steps.breaker.outputs.skip != 'true'
        run: |
          python3 scripts/fix_engine.py \
            --tier safe --tier lint \
            --semgrep-config 'p/default p/security-audit p/secrets' \
            --manifest-dir fix

      - name: Assemble the PR body
        if: steps.breaker.outputs.skip != 'true'
        run: |
          {
            if [ -n "$FAILED_RUN_URL" ]; then
              echo "Opened automatically because CI failed on the default branch"
              echo "(run: $FAILED_RUN_URL). This PR applies only the deterministic"
              echo "fix policy (formatting and tool-verified lint fixes). If the"
              echo "failure was not mechanical, there is nothing to heal here -"
              echo "close this PR and fix the cause."
              echo
            fi
            cat fix/pr-body.md
          } > fix/final-body.md
          cat fix/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the fix PR
        if: steps.breaker.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
          branch: ci/autofix
          title: 'ci: self-heal applied the fix policy'
          body-file: fix/final-body.md
          labels: |
            automation
            autofix
          commit-message: 'ci: self-heal applied the fix policy'
