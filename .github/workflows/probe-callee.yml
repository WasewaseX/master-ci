name: Probe Callee
on:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Callee context
        env:
          WF_SHA: ${{ github.workflow_sha }}
          WF_REF: ${{ github.workflow_ref }}
          GHA_SHA: ${{ github.sha }}
        run: |
          echo "callee workflow_sha=$WF_SHA"
          echo "callee workflow_ref=$WF_REF"
          echo "callee github.sha=$GHA_SHA"
