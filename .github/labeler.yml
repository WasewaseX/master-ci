rust:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.rs'
          - '**/Cargo.toml'
          - '**/Cargo.lock'
node:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.ts'
          - '**/*.tsx'
          - '**/*.js'
          - '**/*.jsx'
          - '**/package.json'
python:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.py'
          - '**/pyproject.toml'
          - '**/requirements*.txt'
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '**/*.mdx'
          - '**/*.rst'
workflows:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
automation:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/autofix.yml'
          - '.github/workflows/stale.yml'
          - '.github/workflows/label.yml'
          - '.github/dependabot.yml'
