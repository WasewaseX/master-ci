# The secrets manifest: the compile-time contract (round-16).
#
# Semaphore fails a pipeline at compile time when it imports a secret
# name that does not exist. This manifest is that contract for the
# workflows under .github/workflows/: every `secrets.NAME` a workflow
# uses must be declared here (sem_secrets_lint.py exits 1 on an unknown
# name), and every declared secret must have a consumer or a retirement
# note. Values are never stored here - names and consumers only.
secrets:
  - name: GITHUB_TOKEN
    description: the implicit Actions token; CI read access and GHCR publishes
    used_by:
      - .github/workflows/audit.yml
      - .github/workflows/integration.yml
      - .github/workflows/master-ci.yml
      - .github/workflows/release-docker.yml
      - .github/workflows/selftest-negative.yml
  - name: AUTOFIX_TOKEN
    description: >
      repo-scoped PAT that lets the autofix, flaky-quarantine and heal
      workflows push branches and open PRs (GITHUB_TOKEN cannot push to
      the required-check-protected main without failing branch
      protection); every consumer falls back to github.token when the
      PAT is absent
    used_by:
      - .github/workflows/autofix.yml
      - .github/workflows/flaky.yml
      - .github/workflows/heal.yml
  - name: DOCKERHUB_USERNAME
    description: Docker Hub account for the release image push
    used_by:
      - .github/workflows/release-docker.yml
  - name: DOCKERHUB_TOKEN
    description: Docker Hub access token for the release image push
    used_by:
      - .github/workflows/release-docker.yml
