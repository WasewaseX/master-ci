[tool.ruff]
line-length = 100
# _ci is the helper checkout; fixtures/ deliberately contain slop and
# broken formatting - the detector scans them, the formatter does not.
extend-exclude = ["_ci", "fixtures"]

[dependency-groups]
# pyyaml backs the optional live filter loading in path_filters.py and
# tool_versions.py; both fall back to bundled JSON when it is absent.
# lizard backs the unified syntax-tree parse in slop_lizard.py; without
# it the structural budgets degrade to the line scanner. tree-sitter
# backs the cognitive-complexity measure in slop_cognitive.py; without
# it that check reports nothing rather than guessing.
scanner = [
    "pyyaml>=6.0",
    "lizard>=1.17",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=1.24.0",
]
# the contract-test suite (tests/) runs under stock pytest.
test = ["pytest>=8.0"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# aliased imports stay in one statement - the duplicate-import check
# counts module-level import statements, and isort's default splitting
# turns one import into five identical-looking ones
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/ai_slop_detector.py" = ["E402"]

[tool.mypy]
exclude = "^_ci/"

[tool.pytest.ini_options]
testpaths = ["tests"]
