# Exact analyzer versions the template installs in CI.
#
# CI behavior must not change because an unrelated tool released a new
# version; bump these by PR after re-validating the template's own gates
# (pytest, ruff, mypy, selftest, dogfood scan) still pass with the new
# version. Project-local tool installs always win over these fallbacks:
# npx resolves a local binary first, and pip installs here run before the
# project's own dependency install can override them.
pip:
  ruff: 0.17.4
  mypy: 2.4.1
  vulture: 2.16
  lizard: 1.25.1
  pytest: 9.0.2
  yamllint: 1.38.0
  semgrep: 1.184.0
  tree-sitter: 0.26.0
  tree-sitter-language-pack: 1.25.0
  # Mutation testing (scheduled workflow). Pinning these matters more
  # than for a linter: a mutmut or Stryker release can change the mutant
  # vocabulary mid-quarter and turn a stable survivor list into noise.
  mutmut: 3.8.1
npm:
  "@biomejs/biome": 2.6.6
  depcheck: 1.4.7
  markdownlint-cli2: 0.24.0
  jscpd: 5.4.2
  "@stryker-mutator/core": 10.1.1
go:
  golangci-lint: v2.13.0
  gremlins: v0.6.0
cargo:
  cargo-deny: 0.20.2
  cargo-llvm-cov: 0.9.1
  cargo-mutants: 27.1.0
  cargo-machete: 0.9.2
maven:
  # The JaCoCo version the JVM stack injects from the command line
  # (prepare-agent + report goals) and the coverage gate's parser reads.
  jacoco: 0.8.16
